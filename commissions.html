<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commissions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="desk.css">
<style>
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}.tbl tr.tot td{font-weight:700;background:var(--paper)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
select.f{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.bank{display:inline-block;font:700 11px var(--body);padding:2px 8px;border-radius:999px;white-space:nowrap}.bank.ok{background:var(--green-soft);color:var(--green)}.bank.wait{background:var(--amber-soft);color:var(--amber)}.bank.paid{background:var(--blue-soft);color:var(--blue)}.bank.void{background:var(--red-soft);color:var(--red-ink)}
.how{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;margin:0 0 14px;overflow-wrap:anywhere}.how b{font-weight:700}.how p{margin:0}.how p+p{margin-top:8px}
.legend{font-size:13px;color:var(--muted);margin:6px 0 0;overflow-wrap:anywhere}.legend .bank{margin-right:4px}
.note .stale{color:var(--red-ink)}.note .btn{padding:4px 10px;font-size:13px;margin-left:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading commissions…</div></div>
<script src="desk.js"></script>
<script>
(function(){
"use strict";
var D = window.DESK, $ = function (s) { return document.querySelector(s); }, esc = D.esc;
var API = "https://lhnjdzurujbwfhhybkcv.supabase.co/functions/v1/pipeline-api/api/";
var B = null, ERR = "", PID = null, PAYEE = "";
var token = function () { try { return localStorage.getItem("dfw_team_token"); } catch (e) { return null; } };
async function api(action, body) {
  var tok = token(); if (!tok) throw new Error("signin");
  var r = await fetch(API + action, { method: "POST", headers: { "content-type": "application/json", "authorization": "Bearer " + tok }, body: JSON.stringify(body || {}) });
  var j = await r.json().catch(function () { return {}; });
  if (r.status === 401) throw new Error("signin"); if (r.status === 403) throw new Error("forbidden");
  if (!r.ok) throw new Error((j && (j.detail || j.error)) || ("http_" + r.status)); return j;
}
// A 200 with an unexpected body ({} / HTML / null) is an error, not a page that hangs on "Loading…". After a good load, a failed
// refresh keeps the last copy on screen and says so; a sign-in or permission failure drops it.
var good = function (j) { return !!(j && typeof j === "object" && j.me && typeof j.me === "object" && typeof j.me.person_id === "string"); };
async function load() {
  try { var j = await api("commissions", { period_id: PID, payee: PAYEE }); if (!good(j)) throw new Error("bad_response"); B = j; ERR = ""; PID = B.pid; }
  catch (e) { ERR = (e && e.message) || "error"; if (ERR === "signin" || ERR === "forbidden") B = null; }
  paint();
}
// *_ct fields are Central wall-clock from the API (with or without a trailing Z); show them as-is, never shifted to the phone's zone.
var ctDate = function (s) { s = String(s).trim().replace(" ", "T").replace(/(\.\d+)?(Z|[+-]\d\d:?\d\d)?$/, ""); if (s.indexOf("T") < 0) s += "T00:00:00"; var d = new Date(s + "Z"); return isNaN(d) ? null : d; };
var ct = function (s) { var d = s ? ctDate(s) : null; return d ? d.toLocaleString("en-US", { timeZone: "UTC", month: "short", day: "numeric" }) : "—"; };
var dOnly = function (s) { if (!s) return "—"; var d = new Date(String(s).slice(0, 10) + "T12:00:00Z"); return isNaN(d) ? "—" : d.toLocaleDateString("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" }); };
var pct = function (v) { return (+v || 0).toString() + "%"; };
var METHOD = { card: "card", ach: "ACH", check: "check", cash: "cash", financing: "financing", other: "other" };
var method = function (m) { return METHOD[m] || String(m || "—"); };
function bank(l) {
  if (l.status === "voided") return '<span class="bank void">voided</span>';
  if (l.status === "paid") return '<span class="bank paid">paid ' + esc(dOnly(l.pay_on)) + "</span>";
  if (l.cleared_ct || l.funded_ct) return '<span class="bank ok">posted to bank ' + esc(ct(l.cleared_ct || l.funded_ct)) + "</span>";
  return '<span class="bank wait">in Lynx, not at the bank yet</span>';
}
// The viewer's own terms, in plain words, from the API's `terms` (null for the owner).
function plan(t, fees) {
  if (!t) return "";
  var parts = [];
  if (+t.rep_rate_pct > 0) parts.push("<b>" + pct(t.rep_rate_pct) + "</b> of every payment that posts to the bank on a job you sold, paid Friday after the Thursday cutoff");
  if (+t.override_pct > 0) parts.push("<b>" + pct(t.override_pct) + "</b> override on " + (t.override_scope === "all" ? "every payment that posts to the bank, company-wide" : t.override_scope === "all_except" ? "every payment that posts to the bank, company-wide, except the reps carved out of your plan" : "payments in your plan") + (t.override_payout === "weekly" ? ", paid Friday with the weekly run" : ", paid on the 15th for the prior month"));
  if (!parts.length) return "";
  var fz = (fees || []).filter(function (f) { return +f.fee_pct > 0; }).map(function (f) { return esc(method(f.method)) + " " + pct(f.fee_pct); });
  var nz = (fees || []).filter(function (f) { return !(+f.fee_pct > 0) && f.method !== "other" && f.method !== "financing"; }).map(function (f) { return esc(method(f.method)); });
  return "<p><b>Your plan:</b> " + parts.join("; ") + ". The rate is applied to the payment after the processing fee" + (fz.length ? " (" + fz.join(", ") + ")" : "") + (nz.length ? "; no fee on " + nz.join(", ") : "") + ". Financing counts at the amount the lender actually funds.</p>";
}
function paint() {
  var app = $("#app");
  if (!B) { app.innerHTML = ERR === "forbidden" ? '<div class="err">Commissions aren’t turned on for your login yet. Ask Blake.</div>' : D.errorBox(ERR || "bad_response"); var rb = app.querySelector("[data-retry]"); if (rb) rb.onclick = load; return; }
  var y = window.scrollY, me = B.me, all = me.all === true, L = B.lines || [], S = B.summary || [], Y = B.ytd || [], P = B.periods || [], per = P.find(function (p) { return p.period_id === B.pid; }) || {}, NT = B.notifications || {}, T = B.terms || null;
  // Never show another person's lines to someone who isn't cleared for everyone's, whatever the API sent.
  if (!all) { var mine = function (x) { return !!x && x.payee_person_id === me.person_id; }; L = L.filter(mine); S = S.filter(mine); Y = Y.filter(mine); }
  // Someone cleared for everyone's lines who picked one person: the totals and year-to-date follow that pick too.
  var who = all && PAYEE ? (B.people || []).find(function (p) { return p.person_id === PAYEE; }) || null : null;
  if (who) { var theirs = function (x) { return !!x && x.payee_person_id === who.person_id; }; S = S.filter(theirs); Y = Y.filter(theirs); }
  var ovrOnly = !all && ((L.length > 0 && L.every(function (l) { return l.kind === "override"; })) || (!L.length && !!T && !(+T.rep_rate_pct > 0) && +T.override_pct > 0));
  var tot = S.reduce(function (a, s) { return a + (+s.total || 0); }, 0), clr = S.reduce(function (a, s) { return a + (+s.cleared || 0); }, 0), paid = S.reduce(function (a, s) { return a + (+s.paid || 0); }, 0);
  var ytdMine = Y.find(function (x) { return x.payee_person_id === me.person_id; }) || null, ytdAll = Y.reduce(function (a, x) { return a + (+x.total || 0); }, 0);
  var h = '<h2>' + (all ? "Commissions" : ovrOnly ? "My overrides" : "My commissions") + ' <span style="font:700 15px var(--body);color:var(--muted)">period ending ' + esc(dOnly(per.cutoff_ct || B.pid)) + " · pays " + esc(dOnly(per.check_date)) + (per.status ? " · " + esc(per.status) : "") + "</span></h2>" +
    '<p class="sub">' + (all ? "Every rep and manager’s commission lines." : ovrOnly ? "Your override on every payment that counts toward your plan." : "Your commission on every payment received on your jobs.") + " A line is earned when the money <b>actually posts to the DFW Roofing Pro bank account</b> — not when the payment is typed into Lynx. The cutoff is Thursday 4:00 PM Central; commissions pay Friday" + (T && +T.override_pct > 0 ? (T.override_payout === "weekly" ? " and overrides pay with them" : "; overrides pay on the 15th for the prior month") : "") + ".</p>";
  h += '<div class="how"><p>' + (NT.enabled ? '<b>Notifications are on.</b> You get ' + (me.phone_on_file ? "a text and an email" : "an email (no cell number on file for texts — give the office one)") + " the moment a payment on your jobs posts to the bank, with the exact commission on it" : "<b>Notifications are not switched on yet.</b> When they are, you get " + (me.phone_on_file ? "a text and an email" : "an email") + " the moment a payment posts to the bank, with the exact commission on it") + (NT.sent_to_me ? " · " + esc(NT.sent_to_me) + " sent to you so far, last " + esc(D.ago(NT.last_to_me)) : "") + ". <b>Nothing is sent for a payment that is only logged in Lynx</b> — the notice goes out when the bank shows the money, never before.</p>" + plan(T, B.fees) + "</div>";
  var whose = all ? (who ? esc(who.full_name) : "everyone") : "yours";
  h += '<div class="stats"><div class="stat"><div class="v">' + esc(D.cents(tot)) + '</div><div class="l">' + (all ? "earned this period, " + whose : "earned this period") + "</div></div>" +
    '<div class="stat"><div class="v">' + esc(D.cents(clr)) + '</div><div class="l">of that, posted to the bank</div></div>' +
    '<div class="stat"><div class="v">' + esc(D.cents(paid)) + '</div><div class="l">already paid out</div></div>' +
    '<div class="stat"><div class="v">' + esc(D.cents(all ? ytdAll : (ytdMine ? ytdMine.total : 0))) + '</div><div class="l">' + whose + ", year to date</div></div></div>";
  h += '<div class="toolbar"><select class="f" id="per" aria-label="Pay period">' + P.map(function (p) { return '<option value="' + esc(p.period_id) + '"' + (p.period_id === B.pid ? " selected" : "") + ">Period ending " + esc(dOnly(p.cutoff_ct || p.period_id)) + " · " + esc(p.status) + "</option>"; }).join("") + "</select>" +
    (all ? '<select class="f" id="payee" aria-label="Person"><option value="">Everyone</option>' + (B.people || []).map(function (p) { return '<option value="' + esc(p.person_id) + '"' + (PAYEE === p.person_id ? " selected" : "") + ">" + esc(p.full_name) + (p.role === "manager" ? " · manager" : "") + "</option>"; }).join("") + "</select>" : "") + "</div>";
  if (all && S.length) h += '<div class="sec"><h3>By person <span class="n">this period</span></h3><div class="panel" style="overflow:auto"><table class="tbl"><thead><tr><th>Person</th><th>Kind</th><th class="n">Payments</th><th class="n">Earned</th><th class="n">At the bank</th><th class="n">Paid</th><th>Pays</th></tr></thead><tbody>' + S.map(function (s) { return "<tr><td>" + esc(s.payee) + "</td><td>" + esc(s.kind) + '</td><td class="n">' + esc(s.n) + '</td><td class="n">' + esc(D.cents(s.total)) + '</td><td class="n">' + esc(D.cents(s.cleared)) + '</td><td class="n">' + esc(D.cents(s.paid)) + "</td><td>" + esc(dOnly(s.pay_on)) + "</td></tr>"; }).join("") + '<tr class="tot"><td>Total</td><td></td><td class="n">' + S.reduce(function (a, s) { return a + (+s.n || 0); }, 0) + '</td><td class="n">' + esc(D.cents(tot)) + '</td><td class="n">' + esc(D.cents(clr)) + '</td><td class="n">' + esc(D.cents(paid)) + "</td><td></td></tr></tbody></table></div></div>";
  h += '<div class="sec"><h3>Lines <span class="n">' + L.length + "</span></h3>" + (L.length ? '<div class="panel" style="overflow:auto"><table class="tbl"><thead><tr>' + (all ? "<th>Payee</th>" : "") + '<th>Job</th><th>Rep</th><th>Received</th><th>Method</th><th class="n">Payment</th><th class="n">Fee</th><th class="n">Basis</th><th class="n">Rate</th><th class="n">Commission</th><th>Bank</th></tr></thead><tbody>' +
    L.map(function (l) { return "<tr>" + (all ? "<td>" + esc(l.payee) + (l.kind === "override" ? ' <span class="tag">override</span>' : "") + "</td>" : "") + "<td>#" + esc(l.job_number) + (!all && l.kind === "override" ? ' <span class="tag">override</span>' : "") + "</td><td>" + esc(l.rep_name) + "</td><td>" + esc(ct(l.received_ct)) + "</td><td>" + esc(method(l.method)) + '</td><td class="n">' + esc(D.cents(l.payment_amount)) + '</td><td class="n" style="color:var(--muted)">' + (+l.fee_pct > 0 ? "−" + esc(D.cents(l.fee_amount)) + " (" + pct(l.fee_pct) + ")" : "—") + '</td><td class="n">' + esc(D.cents(l.basis)) + '</td><td class="n">' + pct(l.rate_pct) + '</td><td class="n"><b>' + esc(D.cents(l.commission)) + "</b></td><td>" + bank(l) + "</td></tr>"; }).join("") + "</tbody></table></div>" +
    '<p class="legend"><b>Bank column:</b> <span class="bank ok">posted to bank</span> the money is in the DFW Roofing Pro account — earned, and your notice went out · <span class="bank wait">in Lynx, not at the bank yet</span> typed into Lynx but not posted — nothing earned, nothing sent · <span class="bank paid">paid</span> on the paycheck dated.</p>'
    : '<div class="empty">No commission lines in this period' + (all ? "" : " for you") + ". A line appears the moment a payment" + (all ? "" : ovrOnly ? " in your plan" : " on one of your jobs") + " posts to the bank.</div>") + "</div>";
  var pend = B.pending || [];
  h += '<div class="sec"><h3>Logged in Lynx, not at the bank yet <span class="n">' + pend.length + "</span></h3><p class=\"hint\">Payments entered in Lynx" + (all ? "" : " on your jobs") + " in the last 60 days that have not posted to the bank. Nothing is earned, and no notice is sent, until the money posts; once it does the line shows up above and the text/email goes out.</p>" + (pend.length ? '<div class="panel" style="overflow:auto"><table class="tbl"><thead><tr><th>Job</th><th>Rep</th><th>Logged</th><th>Method</th><th class="n">Amount</th></tr></thead><tbody>' + pend.map(function (p) { return "<tr><td>#" + esc(p.job_number) + "</td><td>" + esc(p.rep) + "</td><td>" + esc(ct(p.received_ct)) + "</td><td>" + esc(method(p.method)) + '</td><td class="n">' + esc(D.cents(p.amount)) + "</td></tr>"; }).join("") + "</tbody></table></div>" : '<div class="empty">Nothing waiting.</div>') + "</div>";
  h += '<p class="note">Bank postings last loaded ' + esc(B.bank && B.bank.latest_credit ? D.stamp(B.bank.latest_credit) : "never") + " · last payment matched to the bank " + esc(B.bank && B.bank.latest_cleared ? D.stamp(B.bank.latest_cleared) : "never") + ". Refreshes every 5 minutes." + (ERR ? ' <span class="stale">Couldn’t refresh just now (' + esc(ERR) + '); showing the last copy.</span> <button class="btn ghost" type="button" data-retry>Try now</button>' : "") + "</p>";
  app.innerHTML = h;
  $("#per").onchange = function () { PID = $("#per").value; load(); };
  var pe = $("#payee"); if (pe) pe.onchange = function () { PAYEE = pe.value; load(); };
  var rb2 = app.querySelector("[data-retry]"); if (rb2) rb2.onclick = load;
  window.scrollTo(0, y);
}
D.poll(load);
})();
</script>
</body>
</html>
