<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cash Bids</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="desk.css">
<style>
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 10px}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
.f label{display:block;font:600 12px var(--body);color:var(--muted);margin:0 0 3px}
.f input,.f select{width:100%;font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.f input[type=checkbox]{width:auto;margin-right:6px}
.f .u{color:var(--muted);font-weight:500}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:980px){.two{grid-template-columns:1.2fr .8fr;align-items:start}}
.price{background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px}
.price .big{font:800 40px/1 var(--display)}
.price .m{color:#C7CFDA;font-size:13px}
.price input{font:800 26px var(--display);width:100%;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid rgba(255,255,255,.12);font-size:14px}
.kv.first{border-top:0}
.pill{display:inline-block;font:700 12px var(--body);padding:3px 10px;border-radius:999px}
.pill.good{background:var(--green-soft);color:var(--green)}.pill.warn{background:var(--amber-soft);color:var(--amber)}.pill.bad{background:var(--red-soft);color:var(--red-ink)}.pill.neutral{background:var(--paper);color:var(--muted)}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 12px;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line input[type=text]{width:100%;font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px dashed transparent;padding:2px 0}
.line input[type=text]:focus{outline:0;border-bottom-color:var(--line)}
.line .x{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
.line .grp{font:700 11px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.opt{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center;padding:7px 12px;border-top:1px solid var(--line)}
.opt input{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.photos{display:flex;flex-wrap:wrap;gap:8px}.photos img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.req{background:var(--blue-soft);color:var(--ink);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.ok{background:var(--green-soft);color:var(--green);border-radius:8px;padding:10px 12px;margin:10px 0}
.srcs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.sumline{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
textarea.t{min-height:64px}
.modeReq .wrap{max-width:720px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading cash bids…</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
(function(){

var MODE = Q.mode === "request" ? "request" : "desk";

// ---------- state ----------

}

  var t = { valid_days: 30, deposit_pct: 50, pay_terms: "deposit", warranty_years: 5, payment: "Payment in full is due upon completion of the work.", financing: true, exclusions: "Price covers the scope listed above. Rotten or damaged decking beyond what is listed is replaced with homeowner approval at the per-sheet price shown. Hidden conditions found during tear-off are priced in writing before work continues.", notes: "" };
  try { var s = JSON.parse(localStorage.getItem(LSK) || "null"); if (s && typeof s === "object") Object.assign(t, s); } catch (e) { /* ignore */ }

  for (var i = 0; i < (names || []).length; i++) {
    var w = String(names[i]).toLowerCase().trim().split(/\s+/); if (!w[0]) continue;
    var f = al[w[0]] || w[0], l = w[w.length - 1];
    var k = keys.find(function (k) { var kw = k.toLowerCase().split(/\s+/); var kf = al[kw[0]] || kw[0]; return kw[kw.length - 1] === l && (kf === f || kf[0] === f[0]); });
    if (k) return k;
  }

}

// ---------- queue ----------
async function loadQueue() { try { QUEUE = await cb("queue"); QERR = ""; } catch (e) { QERR = e.message; } if (VIEW === "queue") paintQueue(); }
async function loadPB() { try { var d = await hc("hc_load"); if (d.pricebook && d.pricebook.items) { PB = Object.assign({}, PB_DEF, d.pricebook.items); PBAT = d.pricebook.updated_at || null; } } catch (e) { /* defaults */ } }
function srcTag(it) { return it.source === "lynx_name" ? '<span class="tag b">rep flagged it in Lynx</span>' : it.source === "request" ? '<span class="tag b">requested in the app</span>' : it.source === "retail" ? '<span class="tag">retail job</span>' : '<span class="tag">bid on file</span>'; }

  var h = '<h2>Cash bids</h2><p class="sub">Every job a rep has asked for a cash bid on — flagged in the Lynx job name or requested here — priced with your rate card, filed to the job, and sent back to the rep.</p>' +
    '<p class="fresh">Updated <b>' + esc(D.stamp(QUEUE.at)) + '</b> Central · jobs from Lynx ' + esc(D.stamp(QUEUE.fresh && QUEUE.fresh.jobs_at)) + (PBAT ? ' · price book ' + esc(D.stamp(PBAT)) : "") + "</p>" +
    '<div class="stats"><div class="stat' + (K.requested ? " hot" : "") + '"><div class="v">' + (K.requested || 0) + '</div><div class="l">waiting for a bid' + (K.oldest_days ? " · oldest " + K.oldest_days + "d" : "") + '</div></div>' +

    '<div class="chips">' + [["requested", "Waiting · " + (K.requested || 0)], ["priced", "Priced · " + (K.priced || 0)], ["sent", "Sent · " + (K.sent || 0)], ["all", "All · " + items.length]].map(function (c) { return '<button class="chip" data-f="' + c[0] + '" aria-pressed="' + (FILTER === c[0]) + '">' + esc(c[1]) + "</button>"; }).join("") + "</div>" +

      var rq = it.request && it.request.details ? '<div class="s">Rep asked for: ' + esc(String(it.request.details.what || "").replace(/_/g, " ")) + (it.request.details.shingle ? " · " + esc(it.request.details.shingle) : "") + (it.request.details.notes ? " · " + esc(it.request.details.notes).slice(0, 140) : "") + "</div>" : "";

    }).join("") || '<div class="empty">Nothing here.</div>') + "</div>" +
    '<p class="note">A job lands here when its Lynx name contains “CASH BID”, when a rep taps “Request a cash bid” on the job in this app, or when the work type is Retail. Refreshes every 5 minutes.</p>';

  app.querySelectorAll("[data-f]").forEach(function (b) { b.onclick = function () { FILTER = b.dataset.f; paintQueue(); }; });

// ---------- builder ----------
async function openJob(ref) {
  VIEW = "job"; LOADING = true; J = null; H = null; JERR = ""; FILED = null; MSG = ""; PHOTOS = []; OPTS = []; PRICE = ""; NOTE = "";
  paintJob();
  try {
    var jr = await cb("job", { job: ref }); if (!jr || !jr.job) throw new Error("bad_response"); J = jr;
    try { H = await hc("hc_pull", { job_number: jr.job.num }); } catch (e) { H = null; }
  } catch (e) { JERR = e.message === "job_not_found" ? "No Lynx job with that number." : e.message === "signin" ? "Your sign-in has expired. Sign out of the team app and back in, then open Cash Bids again." : e.message === "forbidden" ? "The cash bid desk is for the office and managers. Ask Blake if you need it." : "Couldn’t load that job (" + e.message + "). Try again in a moment."; }
  LOADING = false;
  if (J) { IN = buildInputs(); TERMS = termsDefault(); SCOPE = autoScope(); }
  paintJob();
}
function buildInputs() {
  var j = defaults(), job = J.job, rd = (H && H.read) || {}, cad = (H && H.cad) || J.cad || null;
  j.customer = (J.customer && J.customer.name) || job.name || ""; j.address = [job.street, job.city].filter(Boolean).join(", ");
  var ck = Object.keys(CITIES).find(function (c) { return c.toLowerCase() === String(job.city || "").toLowerCase(); }); j.city = ck || (job.city ? "Other" : "");
  j.rep = repKey((job.reps || []).map(function (r) { return r.name; })) || "";
  var fill = function (k, v) { if (v == null || v === "") return; j[k] = typeof v === "number" ? String(v) : v; };
  ["sq", "eaves", "rakes", "ridges", "hips", "valleys", "wall", "boots", "boxvents", "turbines", "powervents", "chimneys", "skylights", "deckSheets", "ridgeVent", "woodLf", "ventCancel", "versacaps", "gutterLf", "screens", "garageDoors"].forEach(function (k) { fill(k, rd[k]); });
  if (rd.pitch) j.pitch = rd.pitch; if (+rd.stories > 0) j.stories = +rd.stories; if (+rd.layers > 0) j.layers = +rd.layers;
  if (rd.shingle && PB[rd.shingle] != null) j.shingle = rd.shingle; if (rd.cap && ["3tab", "hr", "ir"].includes(rd.cap)) j.cap = rd.cap;
  if (rd.valleyMetal) j.valleyMetal = true;
  if (cad && !(+rd.stories > 0) && +cad.stories > 0) j.stories = Math.min(3, Math.round(+cad.stories));
  // the rep's request, if any, picks the shingle/color
  var rq = (J.requests || [])[0]; if (rq && rq.details) { var d = rq.details; if (d.shingle) { var sk = SHINGLES.find(function (s) { return s[1].toLowerCase().indexOf(String(d.shingle).toLowerCase()) >= 0 || s[0] === d.shingle; }); if (sk) j.shingle = sk[0]; } if (d.color) j.color = d.color; }
  return j;
}
function calc(inputs) {
  var x = Object.assign({}, inputs || IN); x.jobType = "retail"; x.contract = PRICE !== "" ? N(PRICE) : 0;
  // Cash deals pay the rep a flat $500 when the job pays out — not the % plan. Priced as a fixed cost, no override.
  x.commPreset = "none"; x.mikeOvr = false; x.teamMgr = "none"; x.extras = (x.extras || []).concat([{ label: "Rep pay — cash deal (flat)", amt: 500 }]);
  var c = compute(PB, x);
  var suggested = isFinite(c.priceAtTarget) ? round25(c.priceAtTarget) : 0;
  if (x.contract <= 0) { x.contract = suggested; c = compute(PB, x); }
  c.suggested = suggested; c.price = x.contract; return c;
}
function sheetPrice() { var a = calc(Object.assign({}, IN, { deckSheets: N(IN.deckSheets) + 1 })), b = calc(); var d = a.priceAtTarget - b.priceAtTarget; return isFinite(d) && d > 0 ? Math.ceil(d / 5) * 5 : 0; }

  var layers = Math.max(1, +j.layers || 1), sh = SHN(j.shingle);
  if (N(j.sq) > 0) {
    add("Roof", "Remove the existing roofing (" + layers + " layer" + (layers > 1 ? "s" : "") + ") down to the decking and haul away all debris");
    add("Roof", "Inspect the roof decking and re-nail loose decking" + (N(j.deckSheets) > 0 ? "; replace " + N(j.deckSheets) + " sheet" + (N(j.deckSheets) > 1 ? "s" : "") + " of damaged decking (included)" : ""));
    add("Roof", "Install synthetic underlayment over the entire roof deck");
    add("Roof", "Install ice & water shield in all valleys and around roof penetrations");

    add("Roof", "Install new " + (j.cap === "ir" ? "Class 4 impact-resistant" : j.cap === "hr" ? "12\" high-profile" : "matching") + " hip & ridge cap shingles");
    add("Roof", "Install new painted metal drip edge at all eaves and rakes");
    if (N(j.valleys) > 0 && j.valleyMetal) add("Roof", "Install new metal valleys (" + N(j.valleys) + " lf)");
    if (N(j.wall) > 0) add("Roof", "Install new step and counter flashing at walls (" + N(j.wall) + " lf)");
    if (N(j.woodLf) > 0) add("Roof", "Replace " + N(j.woodLf) + " lf of rotten fascia / wood");
  }
  if (N(j.boots) > 0) add("Vents & flashing", "Replace " + N(j.boots) + " pipe boot" + (N(j.boots) > 1 ? "s" : ""));
  if (N(j.boxvents) > 0) add("Vents & flashing", "Replace " + N(j.boxvents) + " box vent" + (N(j.boxvents) > 1 ? "s" : "") + " with new painted vents");
  if (N(j.turbines) > 0) add("Vents & flashing", "Replace " + N(j.turbines) + " turbine" + (N(j.turbines) > 1 ? "s" : ""));
  if (N(j.powervents) > 0) add("Vents & flashing", "Replace " + N(j.powervents) + " power vent" + (N(j.powervents) > 1 ? "s" : ""));
  if (N(j.versacaps) > 0) add("Vents & flashing", "Install " + N(j.versacaps) + " new versa cap" + (N(j.versacaps) > 1 ? "s" : "") + " on furnace / water-heater flues");
  if (N(j.ridgeVent) > 0) add("Vents & flashing", "Install " + N(j.ridgeVent) + " lf of ridge vent");
  if (N(j.ventCancel) > 0) add("Vents & flashing", "Remove " + N(j.ventCancel) + " unused vent" + (N(j.ventCancel) > 1 ? "s" : "") + " and deck over");

  if (N(j.screens) > 0) add("Additional work", "Replace " + N(j.screens) + " window screen" + (N(j.screens) > 1 ? "s" : ""));

    add("Site & permits", "Final walk-through with the homeowner");

}
function paintJob() {
  VIEW = "job"; var app = $("#app");
  var head = '<p><button class="btn ghost" id="back" type="button">← Cash bids</button></p>';
