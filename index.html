<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DFW Team">
<meta name="theme-color" content="#1E2A38">
<title>DFW Roofing Pro — Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E2A38;--red:#EE0000;--red-ink:#C80000;--paper:#F3F4F6;--card:#fff;--ink:#111418;--muted:#5B6470;--line:#DADDE2;--blue:#2F6FB5;--blue-soft:#E3EDF8;--amber:#B97A00;--amber-soft:#FBF1DA;--green:#1F7A4D;--green-soft:#E0F2E8;--red-soft:#FDE6E6;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--paper:#0F1419;--card:#1A222C;--ink:#EEF1F4;--muted:#9AA4B0;--line:#2C3744;--red-ink:#FF5A5A;--red-soft:#3A1416;--blue:#7FB0E8;--blue-soft:#18293C;--amber:#E8B04A;--amber-soft:#382B12;--green:#5CC28E;--green-soft:#12301F}}
*{box-sizing:border-box}html{height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header .brand{font:800 22px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}header .brand b{color:var(--red)}
header .who{font-size:13px;color:#B9C3CE;text-align:right}header button{background:none;border:1px solid #4A5A6C;color:#fff;border-radius:6px;padding:4px 10px;font:600 12px var(--body);margin-top:4px;cursor:pointer}
nav{position:sticky;top:0;z-index:5;background:var(--navy);display:flex;overflow-x:auto;scrollbar-width:none;padding:0 8px}
nav button{background:none;border:0;color:#B9C3CE;padding:12px 14px 10px;font:700 18px/1 var(--display);letter-spacing:.03em;border-bottom:4px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:#fff;border-bottom-color:var(--red)}
main{max-width:860px;margin:0 auto;padding:16px}
h2{font:800 28px/1.05 var(--display);margin:4px 0 6px}.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px}
.list{list-style:none;margin:0;padding:0}.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}.row:hover{background:var(--paper)}.t{font-weight:600}.m{font-size:14px;color:var(--muted)}.r{text-align:right;font:700 15px/1.2 var(--display);white-space:nowrap}
.note1{grid-column:1/-1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font:700 12px var(--body);padding:2px 9px;border-radius:999px}
.st-Lead{background:var(--blue-soft);color:var(--blue)}.st-Prospect{background:var(--amber-soft);color:var(--amber)}.st-Approved{background:var(--green-soft);color:var(--green)}.st-Completed,.st-Invoiced{background:var(--red-soft);color:var(--red-ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 14px var(--body);cursor:pointer}.chip[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
input,textarea,select{font:16px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
textarea{min-height:110px;resize:vertical}label{display:block;font-weight:700;margin:12px 0 5px}
.grid{display:grid;grid-template-columns:1fr;gap:0 12px}@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 18px;font:700 16px var(--body);cursor:pointer;text-decoration:none}
.btn.ghost{background:none;color:var(--red-ink);border:1px solid var(--red)}.btn[disabled]{opacity:.5;cursor:wait}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.empty{padding:22px 16px;color:var(--muted)}.fresh{font-size:13px;color:var(--muted);margin:10px 2px}
.day{font:800 20px var(--display);margin:18px 0 8px}.adj{background:var(--amber-soft);color:var(--amber)}
.login{max-width:420px;margin:8vh auto 0}.login .panel{padding:20px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}#sheet[hidden]{display:none}
#sheet .sh{background:var(--paper);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px))}
@media(min-width:760px){#sheet{align-items:center}#sheet .sh{border-radius:12px}}
.shh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.shh h3{margin:0;font:800 26px/1.05 var(--display)}
.x{background:var(--card);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;font-size:22px;cursor:pointer;color:var(--ink);flex:none}
.facts{padding:4px 14px;margin-top:12px}.facts div{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.facts div:first-child{border-top:0}.facts span{min-width:96px;color:var(--muted)}
h4{font:700 19px var(--display);margin:18px 0 8px}
.nt{padding:10px 14px;border-top:1px solid var(--line);font-size:14px;white-space:pre-wrap}.nt:first-child{border-top:0}.nt b{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
.ok{background:var(--green-soft);color:var(--green);border-radius:8px;padding:12px 14px;margin-top:12px}.err{background:var(--red-soft);color:var(--red-ink);border-radius:8px;padding:12px 14px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}.toast.on{opacity:1}
a{color:var(--blue)}
</style>
</head>
<body>
<header><div class="brand">DFW <b>Roofing</b> Pro</div><div class="who" id="who"></div></header>
<nav id="tabs" hidden></nav>
<main id="main"></main>
<div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Job"><div class="sh" id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
const API="https://lhnjdzurujbwfhhybkcv.supabase.co/functions/v1/portal-api/api/";
const LS="dfw_team_token";
let TOKEN=null; try{TOKEN=localStorage.getItem(LS)}catch(e){}
let ME=null, HOME=null, TAB="jobs", STAGE="", Q="", SCOPE="mine";
let HC=false, HCJOB="", COCJOB="", CBJOB="";
const PROD_ROLES=["owner","manager","office"]; const canProd=()=>!!(ME&&PROD_ROLES.includes(ME.role)); const HCR="https://lhnjdzurujbwfhhybkcv.supabase.co/functions/v1/hc-relay/api/";
const STAGES=["Lead","Prospect","Approved","Completed","Invoiced"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opId=()=>{const a=new Uint8Array(12);crypto.getRandomValues(a);return "op"+Array.from(a,b=>b.toString(16).padStart(2,"0")).join("")};
const tz={timeZone:"America/Chicago"};
const when=s=>s?new Date(s).toLocaleString("en-US",{...tz,month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"—";
const time=s=>s?new Date(s).toLocaleTimeString("en-US",{...tz,hour:"numeric",minute:"2-digit"}):"";
const dayKey=s=>new Date(s).toLocaleDateString("en-US",{...tz,weekday:"long",month:"short",day:"numeric"});
const addr=a=>a?[a.street1,a.city,a.state&&(a.state.abbreviation||a.state),a.zipCode].filter(Boolean).join(", "):"";
const maps=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove("on"),2200)}
async function api(action,body={}){
  const r=await fetch(API+action,{method:"POST",headers:{"content-type":"application/json",...(TOKEN?{authorization:"Bearer "+TOKEN}:{})},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({error:"bad_response"}));
  if(r.status===401&&!action.startsWith("login")){TOKEN=null;try{localStorage.removeItem(LS)}catch(e){};login();throw new Error("signed_out")}
  if(!r.ok){const e=new Error(j.error||("http_"+r.status));e.data=j;e.status=r.status;throw e}
  return j;
}
/* ---------- sign in ---------- */
function login(){
  $("#tabs").hidden=true;$("#who").innerHTML="";
  $("#main").innerHTML=`<div class="login"><h2>Sign in</h2><p class="sub">Use your work email. We'll text and email you a 6-digit code.</p><div class="panel">
    <label for="em" style="margin-top:0">Work email</label><input id="em" type="email" inputmode="email" autocomplete="email">
    <div id="cb" hidden><label for="cd">Code</label><input id="cd" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
    <div class="btns"><button class="btn" id="go">Send my code</button></div><div class="fresh" id="lm"></div></div></div>`;
  let stage="start";const go=$("#go"),em=$("#em"),cd=$("#cd"),lm=$("#lm");
  async function submit(){go.disabled=true;try{
    if(stage==="start"){const r=await api("login_start",{email:em.value});$("#cb").hidden=false;cd.focus();stage="verify";go.textContent="Sign in";
      lm.textContent=r.sent?"Code sent"+(r.texted?" by text":"")+(r.emailed?(r.texted?" and email":" by email"):"")+". It expires in 10 minutes.":"If that email is on the team, a code is on its way.";}
    else{const r=await api("login_verify",{email:em.value,code:cd.value});TOKEN=r.token;try{localStorage.setItem(LS,TOKEN)}catch(e){};boot();}
  }catch(e){lm.textContent=e.message==="code_invalid"?"That code didn't match. Try again.":e.message==="too_many_codes"?"Too many codes requested. Wait a few minutes.":"Something went wrong. Try again."}finally{go.disabled=false}}
  go.onclick=submit;em.onkeydown=e=>{if(e.key==="Enter")submit()};cd.onkeydown=e=>{if(e.key==="Enter")submit()};em.focus();
}
/* ---------- shell ---------- */
async function boot(){
  if(!TOKEN) return login();
  try{const r=await api("me");ME=r.me;if(ME.team)SCOPE="team";if(!r.sales){$("#main").innerHTML=`<div class="empty">Your login doesn't have the sales portal turned on yet. Ask the office.</div>`;return}
    if(ME.role==="office"&&TAB==="jobs")TAB="prod";
    $("#who").innerHTML=`${esc(ME.name)}<br><button id="lo">Sign out</button>`;
    $("#lo").onclick=async()=>{try{await api("logout")}catch(e){};TOKEN=null;try{localStorage.removeItem(LS)}catch(e){};login()};
    try{const hr=await fetch(HCR+"hc_load",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+TOKEN},body:"{}"});HC=hr.ok}catch(e){HC=false}
    tabs();await load();
  }catch(e){if(e.message!=="signed_out")$("#main").innerHTML=`<div class="empty">Couldn't load. Pull to refresh or try again.</div>`}
}
function tabs(){const t=$("#tabs");t.hidden=false;
  const PT=canProd()?PAGES.filter(p=>p.roles.includes(ME.role)).map(p=>[p.key,p.label]):[]; const office=ME&&ME.role==="office";
  t.innerHTML=[...(office?PT:[]),["jobs","My Jobs"],["day","My Day"],["lead","New Lead"],["carriers","Carriers"],["colors","Colors"],...(HC?[["hardcost","Hard Cost"]]:[]),...(office?[]:PT),...(ME&&ME.team?[["subs","Subs"]]:[]),...(ME&&["owner","office"].includes(ME.role)?[["conn","Connections"]]:[]),...(ME&&ME.team?[["cmd","Command"]]:[])].map(([k,l])=>`<button data-t="${k}" aria-selected="${TAB===k}">${l}</button>`).join("");
  t.querySelectorAll("button").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;tabs();render()});}
async function load(){ $("#main").innerHTML=`<div class="empty">Loading…</div>`; HOME=await api("home",{scope:SCOPE}); render(); }
function render(){const pg=PAGES.find(p=>p.key===TAB);if(pg&&!(canProd()&&pg.roles.includes(ME.role)))TAB="jobs";$("#main").style.maxWidth=(TAB==="hardcost"||PAGES.some(p=>p.key===TAB))?"none":"";const fn=({jobs:renderJobs,day:renderDay,lead:renderLead,carriers:renderCarriers,colors:renderColors,hardcost:renderHC,subs:renderSubs,conn:renderConn,cmd:renderCmd,coc:renderCOC})[TAB];if(fn)fn();else if(PAGES.some(p=>p.key===TAB))renderPage(TAB);else renderJobs();}

/* ===== Subs hub: text crews and vendors from the company line, send labor POs, keep every thread here ===== */
const SUBSAPI="https://lhnjdzurujbwfhhybkcv.supabase.co/functions/v1/subs-hub/api/";
let SUBS=[], SUBUNK=[], SUB=null, SUBPH="", SUBPO=null, SUBTIMER=null, SUBFROM="";
async function subsApi(action,body={}){const r=await fetch(SUBSAPI+action,{method:"POST",headers:{"content-type":"text/plain;charset=UTF-8"},body:JSON.stringify(Object.assign({},body,{_t:TOKEN||""}))});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.detail||j.error||("http_"+r.status));throw e;}return j;}
const tfmt=s=>s?new Date(s).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZone:"America/Chicago"}):"";
function fmtPhone(p){const d=String(p||"").replace(/\D/g,"").replace(/^1(?=\d{10}$)/,"");return d.length===10?d.replace(/(\d{3})(\d{3})(\d{4})/,"$1-$2-$3"):String(p||"");}
async function renderSubs(){
  clearTimeout(SUBTIMER);
  if(SUB||SUBPH) return renderSubThread();
  $("#main").innerHTML=`<h1>Subs</h1><p class="sub">Text crews and vendors from the company line ${SUBFROM?"("+fmtPhone(SUBFROM)+")":""}. Replies come back here. Labor POs post to the Lynx job.</p><div class="empty">Loading…</div>`;
  try{const d=await subsApi("subs_list");SUBS=d.subs||[];SUBUNK=d.unknown||[];SUBFROM=d.from||SUBFROM;}catch(e){$("#main").innerHTML=`<h1>Subs</h1><div class="empty">Couldn't load the subs hub (${esc(e.message)}).</div>`;return;}
  const row=s=>`<button class="card" data-sub="${s.id}" style="text-align:left;width:100%"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="t">${esc(s.name)}${s.company&&s.company!==s.name?` <span style="color:var(--muted);font-weight:400">· ${esc(s.company)}</span>`:""}</div><div class="m">${esc(s.trade||"")}${s.phone?" · "+fmtPhone(s.phone):' · <span style="color:var(--warn)">no phone yet</span>'}</div>${s.last_body?`<div class="m" style="margin-top:4px;color:var(--ink)">${esc(String(s.last_body).slice(0,90))}${String(s.last_body).length>90?"…":""}</div>`:""}</div><div style="text-align:right;white-space:nowrap">${s.unread?`<span class="tag t-red">${s.unread} new</span><br>`:""}<span class="m">${tfmt(s.last_at)}</span></div></div></button>`;
  $("#main").innerHTML=`<h1>Subs</h1><p class="sub">Text crews and vendors from the company line ${SUBFROM?"("+fmtPhone(SUBFROM)+")":""}. Replies come back here. Labor POs post to the Lynx job.</p>
    ${SUBUNK.length?`<div class="card"><div class="t">New texts from numbers not on the list</div>${SUBUNK.map(u=>`<div style="display:flex;justify-content:space-between;gap:8px;margin-top:6px"><button class="btn ghost" data-subph="${esc(u.phone)}">${fmtPhone(u.phone)} · ${u.unread} new</button><span class="m">${tfmt(u.last_at)}</span></div>`).join("")}</div>`:""}
    <div class="list">${SUBS.map(row).join("")}</div>
    <details class="card" style="margin-top:12px"><summary class="t" style="cursor:pointer">Add a sub or vendor</summary><div class="f" style="margin-top:8px"><label>Name<input id="snName" placeholder="e.g. Cody"></label><label>Company<input id="snCo" placeholder="e.g. Silva Home Solutions"></label><label>Trade<input id="snTr" placeholder="e.g. Fence stain"></label><label>Cell<input id="snPh" inputmode="tel" placeholder="214-555-0100"></label><button class="btn" id="snAdd" type="button">Add</button></div></details>`;
  $("#main").querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{SUB=+b.dataset.sub;SUBPH="";SUBPO=null;renderSubs();});
  $("#main").querySelectorAll("[data-subph]").forEach(b=>b.onclick=()=>{SUB=null;SUBPH=b.dataset.subph;SUBPO=null;renderSubs();});
  $("#snAdd").onclick=async()=>{const name=$("#snName").value.trim();if(!name){toast("Name first");return;}try{await subsApi("sub_add",{name,company:$("#snCo").value.trim(),trade:$("#snTr").value.trim(),phone:$("#snPh").value.trim()});toast("Added");renderSubs();}catch(e){toast("Couldn't add ("+e.message+")");}};
}
async function renderSubThread(){
  let d; try{d=await subsApi("sub_thread",SUB?{sub_id:SUB}:{phone:SUBPH});}catch(e){$("#main").innerHTML=`<button class="btn ghost" id="subBack">← Subs</button><div class="empty">${esc(e.message)}</div>`;$("#subBack").onclick=()=>{SUB=null;SUBPH="";renderSubs();};return;}
  const s=d.sub||{}, msgs=d.messages||[];
  const bubble=m=>`<div style="display:flex;justify-content:${m.direction==="out"?"flex-end":"flex-start"};margin:6px 0"><div style="max-width:85%;padding:8px 12px;border-radius:12px;background:${m.direction==="out"?"var(--red)":"var(--card)"};color:${m.direction==="out"?"#fff":"var(--ink)"};border:1px solid ${m.direction==="out"?"var(--red)":"var(--line)"};white-space:pre-wrap;font-size:14px">${esc(m.body)}<div style="font-size:11px;opacity:.75;margin-top:4px">${m.kind==="po"?"LABOR PO · ":""}${m.job_number?"#"+esc(m.job_number)+" · ":""}${m.direction==="out"?esc(m.sent_by||"")+" · ":""}${tfmt(m.at)}${m.direction==="out"&&m.status?" · "+esc(m.status):""}</div></div></div>`;
  $("#main").innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn ghost" id="subBack" type="button">← Subs</button><div style="text-align:right"><div class="t">${esc(s.name||fmtPhone(s.phone))}${s.company&&s.company!==s.name?` <span style="color:var(--muted);font-weight:400">· ${esc(s.company)}</span>`:""}</div><div class="m">${esc(s.trade||"")}${s.phone?" · "+fmtPhone(s.phone):""}${s.phone?` · <a href="tel:${esc(s.phone)}">call</a>`:""}</div></div></div>
    ${!s.id?`<div class="card" style="margin-top:8px"><div class="m">This number isn't on your list.</div><div class="f" style="margin-top:6px"><label>Name<input id="unkName"></label><label>Trade<input id="unkTrade"></label><button class="btn" id="unkAdd" type="button">Add as sub</button></div></div>`:""}
    <div id="subMsgs" style="margin:10px 0;max-height:52vh;overflow:auto;padding:4px">${msgs.length?msgs.map(bubble).join(""):'<div class="empty">No messages yet.</div>'}</div>
    ${s.phone?`<div class="card"><textarea id="subText" rows="2" placeholder="Text ${esc(s.name||"")}…" style="width:100%"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center"><input id="subJob" placeholder="Job # (optional, logs to Lynx)" inputmode="numeric" style="max-width:220px"><button class="btn" id="subSend" type="button">Send text</button><button class="btn ghost" id="subPoBtn" type="button">Labor PO</button></div></div>
    <div id="subPo"></div>`:`<div class="empty">Add a cell number to text ${esc(s.name||"this sub")}.</div>`}`;
  $("#subBack").onclick=()=>{SUB=null;SUBPH="";SUBPO=null;renderSubs();};
  const box=$("#subMsgs"); if(box) box.scrollTop=box.scrollHeight;
  if($("#unkAdd")) $("#unkAdd").onclick=async()=>{const name=$("#unkName").value.trim();if(!name){toast("Name first");return;}try{const r=await subsApi("sub_add",{name,trade:$("#unkTrade").value.trim(),phone:s.phone});SUB=r.id;SUBPH="";toast("Added");renderSubs();}catch(e){toast("Couldn't add ("+e.message+")");}};
  if($("#subSend")) $("#subSend").onclick=async()=>{const body=$("#subText").value.trim();if(!body){toast("Type a message");return;}$("#subSend").disabled=true;try{await subsApi("sub_send",{sub_id:s.id,body,job_number:$("#subJob").value.trim()});toast("Sent");renderSubThread();}catch(e){toast("Not sent ("+e.message+")");$("#subSend").disabled=false;}};
  if($("#subPoBtn")) $("#subPoBtn").onclick=()=>{SUBPO=SUBPO||{job:$("#subJob").value.trim(),date:"",amount:"",notes:"",text:""};renderSubPo(s);};
  if(SUBPO) renderSubPo(s);
  SUBTIMER=setTimeout(()=>{if(TAB==="subs"&&(SUB||SUBPH)&&!SUBPO)renderSubThread();},20000);
}
function renderSubPo(s){
  const p=SUBPO; const el=$("#subPo"); if(!el) return;
  el.innerHTML=`<div class="card" style="margin-top:10px"><div class="t">Labor PO to ${esc(s.name)}</div><div class="f" style="margin-top:6px"><label>Job #<input id="poJob" inputmode="numeric" value="${esc(p.job)}"></label><label>Build date<input id="poDate" placeholder="e.g. Thu Oct 9" value="${esc(p.date)}"></label><label>PO amount (blank = rate card)<input id="poAmt" inputmode="decimal" value="${esc(p.amount)}"></label><label>Notes<input id="poNotes" value="${esc(p.notes)}"></label></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn ghost" id="poPrev" type="button">Preview</button><button class="btn" id="poSend" type="button" ${p.text?"":"disabled"}>Send PO</button><button class="btn ghost" id="poCancel" type="button">Cancel</button></div>

    : `<div class="empty">No agent has reported in yet.</div>`;
  $("#main").innerHTML=h;
}

  return `<button class="btn ${cls||""}" data-ci="${i}" data-kind="email">${esc(text)}</button>`;}
function bindContacts(root){root.querySelectorAll("[data-ci]").forEach(b=>b.addEventListener("click",e=>{const ctx=CTX[+b.dataset.ci];
  if(b.dataset.kind==="text"){ api("contact_log",{job_id:ctx.job_id,kind:ctx.kind,label:ctx.label,to:fmtPh(ctx.phone),body:ctx.text,op_id:opId()}).then(()=>toast("Logged to Lynx")).catch(err=>toast(err.message==="sms_opt_out"?"This number opted out of texts. Use email.":"Couldn't log it to Lynx")); return; }
  if(b.dataset.kind==="call"){ if(ctx.job_id){ api("contact_log",{job_id:ctx.job_id,kind:"call",label:ctx.label,to:fmtPh(ctx.phone),op_id:opId()}).then(()=>toast("Call logged to Lynx")).catch(()=>toast("Couldn't log the call to Lynx")); showCallResult(ctx); } }
  else { e.preventDefault(); openComposer(ctx); }
}))}
function showCallResult(ctx){const box=pick("#callBox");if(!box)return;
  box.innerHTML=`<div class="panel" style="padding:12px;margin-top:12px"><b>How did the call with ${esc(ctx.label)} go?</b><textarea id="crt" placeholder="Left voicemail / spoke to adjuster, reinspection set for Tue 2 PM / waiting on revised scope" style="margin-top:8px"></textarea><div class="btns"><button class="btn" id="crs">Save to Lynx</button><button class="btn ghost" id="crx">Skip</button></div></div>`;
  let op=null;$("#crx").onclick=()=>box.innerHTML="";
  $("#crs").onclick=async()=>{const t=$("#crt").value.trim();if(t.length<2){toast("Add a quick note first");return}if(!op)op=opId();const b=$("#crs");b.disabled=true;
    try{await api("contact_log",{job_id:ctx.job_id,kind:"call_result",label:ctx.label,body:t,op_id:op});box.innerHTML=`<div class="ok">Call result saved to Lynx.</div>`}catch(e){b.disabled=false;toast("Couldn't save. Try again.")}};
  box.scrollIntoView({behavior:"smooth",block:"nearest"});}
function openComposer(ctx){
  const host=pick("#composeBox")||$("#main"); const first=String(ctx.adjName||"").split(/\s+/)[0];
  const su=ctx.su!=null?ctx.su:[ctx.claim?"Claim #"+ctx.claim:"",ctx.insured,ctx.address].filter(Boolean).join(" — ");
  const body=ctx.body!=null?ctx.body:`Hi ${first?first.charAt(0)+first.slice(1).toLowerCase():"there"},\n\nThis is ${ME.name} with DFW Roofing Pro about claim #${ctx.claim||"[claim #]"} for ${ctx.insured||"[insured]"} at ${ctx.address||"[address]"}${ctx.dol?` (date of loss ${ctx.dol})`:""}.\n\n\n\nThank you,\n${ME.name}\nDFW Roofing Pro\n972-979-1070`;
  host.innerHTML=`<div class="panel" style="padding:12px;margin-top:12px"><b>Email ${esc(ctx.label)}</b>
    <label for="ceTo">To</label><input id="ceTo" value="${esc(ctx.email)}"><label for="ceSu">Subject</label><input id="ceSu" value="${esc(su)}">
    <label for="ceBo">Message</label><textarea id="ceBo" style="min-height:180px">${esc(body)}</textarea>
    <div class="btns"><button class="btn" id="ceGo">Open in Gmail &amp; log to Lynx</button><button class="btn ghost" id="ceX">Cancel</button></div>
    <p class="fresh">${ctx.job_id?"The full email is saved to this job in Lynx. Gmail opens with it ready to send.":"Not tied to a job, so this one won't log to Lynx. Email from the job to log it."}</p></div>`;
  $("#ceX").onclick=()=>host.innerHTML=""; let op=null;
  $("#ceGo").onclick=async()=>{const to=$("#ceTo").value.trim(),s2=$("#ceSu").value.trim(),b2=$("#ceBo").value;if(!/@/.test(to)){toast("Add an email address");return}
    window.open(gmail(to,s2,b2),"_blank","noopener");
    if(!ctx.job_id){host.innerHTML="";return}
    if(!op)op=opId();
    try{await api("contact_log",{job_id:ctx.job_id,kind:ctx.kind||"email",label:ctx.label,to,subject:s2,body:b2,op_id:op});host.innerHTML=`<div class="ok">Email saved to Lynx. Hit send in Gmail.</div>`}
    catch(e){toast("Gmail opened, but the Lynx log didn't save. Tap again to retry.")}};
  host.scrollIntoView({behavior:"smooth",block:"nearest"});}
/* ---------- Carriers ---------- */
let CARR=null, CQ="";
async function renderCarriers(){
  if(!CARR){$("#main").innerHTML=`<div class="empty">Loading carriers…</div>`;try{CARR=await api("carriers")}catch(e){$("#main").innerHTML=`<div class="empty">Couldn't load carriers.</div>`;return}}
  const q=CQ.toLowerCase();
  const list=(CARR.carriers||[]).filter(c=>!q||c.carrier.toLowerCase().includes(q)||c.adjusters.some(a=>[a.name,a.job_number,a.claim_number,a.customer].join(" ").toLowerCase().includes(q)));
  $("#main").innerHTML=`<h2>Carriers</h2><p class="sub">Claims lines and mailboxes your team has actually used, plus the adjuster on each of ${ME.team?"the team's":"your"} open claims. Rebuilt from Lynx every hour.</p>
    <div class="tools"><input id="cq" type="search" placeholder="Search carrier, adjuster, job # or claim #" value="${esc(CQ)}"></div>
    ${list.length?list.map(c=>{const name=c.carrier;return `<div class="panel" style="padding:12px 14px;margin-bottom:12px"><div class="shh"><div><h3 style="font:800 22px/1.1 var(--display);margin:0">${esc(name)}</h3><div class="m">${c.files} open claim${c.files===1?"":"s"}</div></div></div>
      ${c.shared_phones.length||c.shared_emails.length?`<div class="m" style="margin-top:8px"><b>Claims lines your team has used</b></div><div class="btns" style="margin-top:6px">${c.shared_phones.map(p=>cbtn({label:name+" claims",phone:p.v},"call",fmtPh(p.v)+" · "+p.n+" claims","ghost")).join("")}${c.shared_emails.map(m=>cbtn({label:name+" claims",email:m.v},"email",m.v+" · "+m.n+" claims","ghost")).join("")}</div><p class="fresh" style="margin:6px 0 0">To log a call or email to Lynx, use the buttons on the adjuster below or on the job.</p>`:""}
      ${c.adjusters.length?`<div class="m" style="margin-top:10px"><b>Adjusters on ${ME.team?"open":"your"} claims</b></div><ul class="list">${c.adjusters.map(a=>{const ctx={job_id:a.job_id,label:(a.name?titleCase(a.name)+" ("+name+")":name+" adjuster"),phone:a.phone,email:a.email,claim:a.claim_number,insured:insured(a.customer),adjName:a.name};return `<li style="padding:10px 0;border-top:1px solid var(--line)"><div class="t">${esc(a.name?titleCase(a.name):"Adjuster")} <span class="m">· ${a.job_number?"#"+esc(a.job_number)+" ":""}${esc(insured(a.customer)||"")}${a.claim_number?" · claim "+esc(a.claim_number):""}</span></div><div class="btns" style="margin-top:6px">${a.phone&&d10(a.phone).length===10?cbtn(ctx,"call","Call "+fmtPh(a.phone)):""}${a.email?cbtn(ctx,"email","Email","ghost"):""}<button class="btn ghost" data-open="${esc(a.job_id)}">Open job</button></div></li>`}).join("")}</ul>`:""}</div>`}).join(""):`<div class="panel"><div class="empty">No carriers match.</div></div>`}
    <div id="callBox"></div><div id="composeBox"></div><p class="fresh">Claim files scanned ${when(CARR.scanned_at)}.</p>`;
  bindContacts($("#main"));
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openJob(b.dataset.open));
  const cq=$("#cq");cq.oninput=e=>{CQ=e.target.value;const pos=cq.selectionStart;renderCarriers();const n=$("#cq");n.focus();n.setSelectionRange(pos,pos)};
}
const titleCase=s=>String(s||"").toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
/* ---------- Colors ---------- */
const COLORS=[
 {name:"Weatherwood",tag:"Most popular",look:"A warm blend of tans, browns and soft grays. Looks natural on most DFW brick and hides dirt well.",pairs:"Tan, beige or cream brick and stone; earth-tone or white siding; brown, bronze or white trim.",note:"IKO calls it Weatherwood. \"Weathered Wood\" is the GAF and TAMKO name, so write Weatherwood on the contract and the order."},
 {name:"Dual Black",tag:"",look:"Deep black with shadow lines for a crisp, timeless look.",pairs:"IKO pairs it with stone, wood, brick or siding, especially white or soft pastel siding. A favorite on white-brick and modern farmhouse homes. Metal accents: copper, black, nickel, chrome or brass.",note:""},
 {name:"Dual Brown",tag:"",look:"A rich brown blend with an earthy, relaxed feel.",pairs:"IKO pairs it with log, beige stone or brick (red brick especially) and brown trim. Metal accents: copper, black, nickel, brass or bronze.",note:""}];
function renderColors(){
  $("#main").innerHTML=`<h2>Colors</h2><p class="sub">What we install most: IKO Cambridge architectural shingles. Tap a color to copy it for the contract note.</p>
    ${COLORS.map((c,i)=>`<div class="panel" style="padding:14px 16px;margin-bottom:12px"><div class="shh"><div><h3 style="font:800 24px/1.05 var(--display);margin:0">${esc(c.name)}</h3><div class="m">IKO Cambridge${c.tag?` · <span class="tag st-Approved">${esc(c.tag)}</span>`:""}</div></div></div>
      <p style="margin:10px 0 6px">${esc(c.look)}</p><p class="m" style="margin:0 0 6px"><b>Pairs with:</b> ${esc(c.pairs)}</p>${c.note?`<p class="m" style="margin:0 0 6px"><b>Heads up:</b> ${esc(c.note)}</p>`:""}
      <div class="btns"><button class="btn" data-c="${i}">Copy "IKO Cambridge – ${esc(c.name)}"</button><a class="btn ghost" href="https://www.iko.com/na/color-gallery/" target="_blank" rel="noopener">See it on IKO</a></div></div>`).join("")}
    <p class="fresh">Screens shift colors. Always show the homeowner a real sample or a photo of a finished house before they pick. <a href="https://www.iko.com/na/document/cambridge" target="_blank" rel="noopener">IKO Cambridge brochure</a></p>`;
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{const t="IKO Cambridge – "+COLORS[+b.dataset.c].name;try{await navigator.clipboard.writeText(t);toast("Copied: "+t)}catch(e){toast(t)}});
}
/* ---------- job sheet ---------- */
function custBlock(d,j,a){const cu=d.customer;if(!cu)return "";const lk=d.links||{};
  const nm=insured(j.name)||cu.name||"the homeowner";const f0=nm.split(/\s+/)[0]||"";const first=f0?f0.charAt(0).toUpperCase()+f0.slice(1).toLowerCase():"there";
  const me1=(ME.name||"").split(" ")[0];
  const phones=(cu.phones||[]).slice(0,2);const mob=phones.find(p=>/mobile|cell/i.test(p.type))||phones.find(p=>p.primary)||phones[0];
  const em=((cu.emails||[]).find(e=>e.primary)||(cu.emails||[])[0]||{}).address||"";
  const base={job_id:j.id,insured:nm,address:a,label:nm};
  const canText=mob&&!mob.smsOptOut&&d10(mob.number).length===10;
  const sig=`\n\nThank you,\n${ME.name}\nDFW Roofing Pro\n972-979-1070`;
  const btns=[];
  phones.forEach(p=>{if(d10(p.number).length===10)btns.push(cbtn({...base,label:"homeowner "+nm,phone:p.number},"call","Call "+fmtPh(p.number),"ghost"))});
  const rv=[],fn=[];
  if(lk.review){const t=`Hi ${first}, it's ${me1} with DFW Roofing Pro. Thank you for trusting us with your roof! If you have a minute, would you share your experience on Google? It helps your neighbors find a roofer they can trust: ${lk.review}`;
    if(canText)rv.push(cbtn({...base,kind:"review_text",phone:mob.number,text:t},"text","Text review link"));
    if(em)rv.push(cbtn({...base,kind:"review_email",email:em,su:"Thank you from DFW Roofing Pro",body:`Hi ${first},\n\nThank you for trusting DFW Roofing Pro with your roof. If you have a minute, would you share your experience on Google? Your review helps your neighbors find a roofer they can trust.\n\n${lk.review}`+sig},"email","Email review link","ghost"));}
  if(lk.financing){const t=`Hi ${first}, it's ${me1} with DFW Roofing Pro. Here's your secure Sunlight Financial application for your new roof: ${lk.financing} Text me here with any questions while you fill it out.`;
    if(canText)fn.push(cbtn({...base,kind:"fin_text",phone:mob.number,text:t},"text","Text financing link"));
    if(em)fn.push(cbtn({...base,kind:"fin_email",email:em,su:"Your Sunlight Financial application",body:`Hi ${first},\n\nHere's your secure Sunlight Financial application for your new roof:\n\n${lk.financing}\n\nReply here with any questions while you fill it out.`+sig},"email","Email financing link","ghost"));}
  const last=k=>(d.posted||[]).find(p=>String(p.kind||"").startsWith(k)&&p.state==="done");
  const lr=last("review"),lf=last("fin");
  return `<h4>Customer</h4><div class="panel facts"><div><span>Name</span>${esc(nm)}</div>
    ${phones.map(p=>`<div><span>${esc(p.type||"Phone")}</span>${esc(fmtPh(p.number))}${p.smsOptOut?' <span class="tag st-Completed">No texts</span>':""}</div>`).join("")}
    ${em?`<div><span>Email</span>${esc(em)}</div>`:""}</div>
    ${btns.length?`<div class="btns">${btns.join("")}</div>`:""}
    ${rv.length?`<div class="btns">${rv.join("")}</div><p class="fresh" style="margin:6px 2px 0">${lr?"Review link last sent "+when(lr.created_at)+". ":""}Asks for an honest Google review.</p>`:""}
    ${fn.length?`<div class="btns">${fn.join("")}</div>${lf?`<p class="fresh" style="margin:6px 2px 0">Financing link last sent ${when(lf.created_at)}.</p>`:""}`:""}
    ${mob&&mob.smsOptOut?`<p class="fresh" style="margin:6px 2px 0">This customer opted out of texts, so links go by email.</p>`:""}
    <p class="fresh" style="margin:6px 2px 0">Calls, texts and emails from these buttons are logged to this job in Lynx.</p>`;}
function insBlock(d,j,a){const ins=d.insurance;if(!ins)return "";const cc=d.carrier_contacts||{};const carrier=ins.carrier||"Carrier";
  const dol=ins.date_of_loss?new Date(ins.date_of_loss).toLocaleDateString("en-US",{timeZone:"UTC",month:"numeric",day:"numeric",year:"numeric"}):"";
  const base={job_id:j.id,claim:ins.claim_number,insured:insured(j.name),address:a,dol};
  const adj={...base,label:(ins.adjuster_name?titleCase(ins.adjuster_name)+" ("+carrier+" adjuster)":carrier+" adjuster"),phone:ins.adjuster_phone,email:ins.adjuster_email,adjName:ins.adjuster_name};
  const btns=[];
  if(ins.adjuster_phone&&d10(ins.adjuster_phone).length===10) btns.push(cbtn(adj,"call","Call adjuster "+fmtPh(ins.adjuster_phone)));
  if(ins.adjuster_email) btns.push(cbtn(adj,"email","Email adjuster","ghost"));
  (cc.phones||[]).slice(0,2).forEach(p=>{if(d10(p.v)!==d10(ins.adjuster_phone))btns.push(cbtn({...base,label:carrier+" claims",phone:p.v},"call","Call "+carrier+" claims "+fmtPh(p.v),"ghost"))});
  (cc.emails||[]).slice(0,1).forEach(m=>{if(m.v!==String(ins.adjuster_email||"").toLowerCase())btns.push(cbtn({...base,label:carrier+" claims",email:m.v},"email","Email "+m.v,"ghost"))});
  return `<h4>Insurance</h4><div class="panel facts"><div><span>Carrier</span>${esc(carrier)}</div>${ins.claim_number?`<div><span>Claim #</span>${esc(ins.claim_number)}</div>`:""}${dol?`<div><span>Date of loss</span>${esc(dol)}</div>`:""}
    <div><span>Adjuster</span>${esc(ins.adjuster_name?titleCase(ins.adjuster_name):"Not in Lynx yet")}${ins.met_with_adjuster?" · met":""}${ins.claim_approved?" · approved":""}</div></div>
    ${btns.length?`<div class="btns">${btns.join("")}</div><p class="fresh" style="margin:6px 2px 0">Calls and emails from these buttons are logged to this job in Lynx.</p>`:`<p class="fresh">No adjuster phone or email in Lynx yet. Add it in Lynx and it shows here within the hour.</p>`}
    <div id="callBox"></div><div id="composeBox"></div>`;}
async function openJob(id){
  const sh=$("#sheet"),bd=$("#sheetBody");bd.innerHTML=`<div class="empty">Loading…</div>`;sh.hidden=false;document.documentElement.style.overflow="hidden";
  try{const d=await api("job",{job_id:id});const j=d.job;const a=addr(j.addr);
    const notes=(d.posted||[]).map(p=>({at:p.created_at,by:"You via portal"+(p.state==="done"?"":" (not sent)"),body:p.text})).concat((d.notes||[]).map(n=>({at:n.posted_at,by:n.author,body:n.body}))).sort((x,y)=>new Date(y.at)-new Date(x.at));
    bd.innerHTML=`<div class="shh"><div><h3>${esc(j.name||"Job")}</h3><div class="m">${j.num?"#"+esc(j.num)+" · ":""}<span class="tag st-${esc(j.milestone)}">${esc(j.milestone)}</span>${j.workType?" · "+esc(j.workType):""}</div></div><button class="x" id="cx" aria-label="Close">×</button></div>
      <div class="panel facts">${a?`<div><span>Address</span><a href="${maps(a)}" target="_blank" rel="noopener">${esc(a)}</a></div>`:""}
        <div><span>Rep</span>${esc((d.reps||[]).filter(r=>r.type!=="Additional"&&r.name).map(r=>r.name).join(", ")||"—")}</div>
        ${j.leadSource?`<div><span>Lead source</span>${esc(j.leadSource)}</div>`:""}<div><span>Created</span>${when(j.created)}</div><div><span>Updated</span>${when(j.updated)}</div></div>
      <div class="btns">${a?`<a class="btn ghost" href="${maps(a)}" target="_blank" rel="noopener">Directions</a>`:""}<a class="btn" href="${esc(j.lynx)}" target="_blank" rel="noopener">Open in Lynx</a>${HC&&j.num?`<button class="btn ghost" id="hcGo" type="button">Hard Cost this job</button>`:""}${j.num?`<button class="btn ghost" id="cbGo" type="button">Request a cash bid</button>`:""}</div>
      ${custBlock(d,j,a)}
      ${insBlock(d,j,a)}
      ${(d.appts||[]).length?`<h4>Appointments</h4><div class="panel"><ul class="list">${d.appts.map(x=>`<li class="row" style="cursor:default"><div><div class="t">${esc(x.title||"Appointment")}</div><div class="m">${esc(x.calendar_name||"")}${x.is_adjuster?" · Adjuster":""}</div></div><div class="r">${when(x.starts_at)}</div></li>`).join("")}</ul></div>`:""}
      <h4>Post a note to Lynx</h4><div class="panel" style="padding:12px"><textarea id="nt" placeholder="What happened, what's next, and @who needs to act"></textarea><div class="btns"><button class="btn" id="ns">Post to Lynx</button></div><div id="nr"></div></div>
      <h4>Notes</h4><div class="panel">${notes.length?notes.map(n=>`<div class="nt"><b>${esc(n.by||"")} · ${when(n.at)}</b>${esc(n.body)}</div>`).join(""):`<div class="empty">No notes captured yet. Lynx has the full history.</div>`}</div>`;
    $("#cx").onclick=closeJob; bindContacts(bd); let op=null; { const hg=$("#hcGo"); if(hg) hg.onclick=()=>{ closeJob(); HCJOB=String(j.num); TAB="hardcost"; tabs(); render(); }; const cg=$("#cbGo"); if(cg) cg.onclick=()=>{ closeJob(); openCashBidRequest(String(j.num)); }; }
    $("#ns").onclick=async()=>{const t=$("#nt").value.trim();if(t.length<3){toast("Write a note first");return}
      if(!op)op=opId();const b=$("#ns");b.disabled=true;b.textContent="Posting…";
      try{await api("job_note",{job_id:id,text:t,op_id:op});op=null;$("#nt").value="";$("#nr").innerHTML=`<div class="ok">Posted to Lynx.</div>`;}
      catch(e){$("#nr").innerHTML=`<div class="err">Lynx didn't take the note. Try again.</div>`;}finally{b.disabled=false;b.textContent="Post to Lynx"}};
  }catch(e){bd.innerHTML=`<div class="shh"><div></div><button class="x" id="cx">×</button></div><div class="err">${e.message==="forbidden"?"This job isn't assigned to you.":"Couldn't open the job."}</div>`;$("#cx").onclick=closeJob}
}
function closeJob(){$("#sheet").hidden=true;document.documentElement.style.overflow=""}
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeJob()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeJob()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&ME&&!["lead","hardcost","cbreq"].includes(TAB)&&!PAGES.some(p=>p.key===TAB))load().catch(()=>{})});
boot();
})();
</script>
</body>
