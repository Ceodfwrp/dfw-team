<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="desk.css">
<style>
.cards{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}
.rep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rep.lead{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.rep h3{font:800 22px/1.05 var(--display);margin:0;display:flex;align-items:baseline;gap:8px}
.rep h3 .rk{font:700 13px var(--body);color:var(--muted)}
.rep .role{font-size:13px;color:var(--muted);margin:2px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;margin:6px 0}
.kpi .v{font:800 22px/1 var(--display)}.kpi .l{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.2}
.kpi.hot .v{color:var(--red-ink)}.kpi.good .v{color:var(--green)}
.bar{height:6px;background:var(--paper);border-radius:3px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--navy)}
.funnel{display:flex;gap:4px;align-items:flex-end;margin:4px 0 8px}
.funnel .f{flex:1;text-align:center;font-size:12px;color:var(--muted)}.funnel .f b{display:block;font:800 18px/1 var(--display);color:var(--ink)}
.funnel .f i{display:block;height:5px;border-radius:3px;background:var(--blue);margin:3px 0 2px}
.own{font-size:12px;color:var(--muted)}.own b{color:var(--ink);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.me td{background:var(--blue-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
/* Activity in Lynx: the team gets a table on wide screens and cards on a phone; a rep gets their own card */
.act{margin-top:26px}.act .sech{margin-bottom:10px}.act .cards{margin-top:0}
.act .tbl td.p{white-space:normal;min-width:150px}.act .tbl td.p small{display:block;font-size:12px;color:var(--muted)}
.act .rep.me{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.act details.grp{margin-top:14px;border:0}.act details.grp>div{margin-top:8px}
@media(min-width:760px){.act.team .cards{display:none}}
@media(max-width:759px){.act .at{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading the team…</div></div>
<script src="desk.js"></script>
<script>
(function(){
"use strict";
var D = window.DESK, $ = function (s) { return document.querySelector(s); }, esc = D.esc;
var API = "https://lhnjdzurujbwfhhybkcv.supabase.co/functions/v1/pipeline-api/api/";
var B = null, ERR = "", DAYS = 90, VIEW = "cards", SORT = "sold_value", ASORT = "total";
var token = function () { try { return localStorage.getItem("dfw_team_token"); } catch (e) { return null; } };
async function api(action, body) {
  var tok = token(); if (!tok) throw new Error("signin");
  var r = await fetch(API + action, { method: "POST", headers: { "content-type": "application/json", "authorization": "Bearer " + tok }, body: JSON.stringify(body || {}) });
  var j = await r.json().catch(function () { return {}; });
  if (r.status === 401) throw new Error("signin"); if (r.status === 403) throw new Error("forbidden");
  if (!r.ok) throw new Error(j.detail || j.error || ("http_" + r.status)); return j;
}
async function load() { try { B = await api("scorecard", { days: DAYS }); ERR = ""; } catch (e) { ERR = e.message; } paint(); }
var pct = function (v) { return v == null ? "—" : (+v).toFixed(v >= 10 ? 0 : 1) + "%"; };
var num = function (v) { return (+v || 0).toLocaleString("en-US"); };
function card(x, i, max) {
  var owner = B.me.role === "owner", isMe = B.me.name && (x.rep === B.me.name || (x.email && B.me.email === x.email));
  var funnel = [["Leads", x.leads], ["Inspections", x.inspections], ["Sold", x.sold], ["Built", x.built]];
  var fm = Math.max(1, x.leads, x.inspections, x.sold, x.built);
  return '<div class="rep' + (i === 0 && B.me.team ? " lead" : "") + '">' +
    '<h3>' + (B.me.team ? '<span class="rk">#' + (i + 1) + "</span>" : "") + esc(x.rep) + "</h3>" +
    '<div class="role">' + (x.role === "manager" ? "Sales manager" : x.role === "rep" ? "Sales rep" : x.on_team ? esc(x.role || "") : "Lynx user · not on the portal") + (x.active === false && x.on_team ? " · inactive" : "") + "</div>" +
    '<div class="kpis"><div class="kpi good"><div class="v">' + esc(D.money(x.sold_value)) + '</div><div class="l">sold · ' + x.sold + " job" + (x.sold === 1 ? "" : "s") + "</div></div>" +
    '<div class="kpi"><div class="v">' + esc(D.money(x.collected)) + '</div><div class="l">collected · ' + x.payments + " payment" + (x.payments === 1 ? "" : "s") + "</div></div>" +
    '<div class="kpi' + (x.late > 5 ? " hot" : "") + '"><div class="v">' + x.late + '</div><div class="l">late jobs · ' + x.on_rep + " waiting on them</div></div></div>" +
    '<div class="bar"><i style="width:' + Math.round(100 * (+x.sold_value || 0) / max) + '%"></i></div>' +
    '<div class="funnel">' + funnel.map(function (f) { return '<div class="f"><b>' + num(f[1]) + "</b><i style=\"width:" + Math.max(6, Math.round(100 * f[1] / fm)) + "%;margin-left:auto;margin-right:auto\"></i>" + f[0] + "</div>"; }).join("") + "</div>" +
    '<div class="kpis"><div class="kpi"><div class="v">' + pct(x.close_rate) + '</div><div class="l">close rate on leads from this window</div></div>' +
    '<div class="kpi"><div class="v">' + (x.avg_contract ? esc(D.money(x.avg_contract)) : "—") + '</div><div class="l">avg contract</div></div>' +
    '<div class="kpi"><div class="v">' + num(x.open_sold) + '</div><div class="l">sold, not closed · ' + esc(D.money(x.open_value)) + "</div></div></div>" +
    '<div class="own">Open now: <b>' + x.open_leads + "</b> leads · <b>" + x.open_prospects + "</b> prospects · <b>" + esc(D.money(x.owed_built)) + "</b> owed on built jobs" + (x.door_knocks ? " · " + x.door_knocks + " door knocks" : "") + (x.sold_insurance || x.sold_retail ? " · sold " + x.sold_insurance + " insurance / " + x.sold_retail + " retail" : "") + (x.lost ? " · " + x.lost + " lost" : "") + "</div>" +
    (owner && x.commission != null ? '<div class="own" style="margin-top:6px;color:var(--amber)">Commission earned ' + esc(D.money(x.commission)) + " on " + x.commission_lines + " payments · " + esc(D.money(x.commission_paid || 0)) + " paid (owner only)</div>" : "") +
    (B.me.team ? '<div class="acts" style="margin:10px 0 0"><button class="btn ghost" type="button" data-pipe="' + esc(x.rep) + '" style="padding:6px 12px;font-size:13px">Open their pipeline</button></div>' : "") +
    "</div>";
}
function table(reps) {
  var owner = B.me.role === "owner";
  var cols = [["rep", "Rep", false], ["leads", "Leads"], ["inspections", "Insp."], ["sold", "Sold"], ["sold_value", "Sold $"], ["close_rate", "Close"], ["avg_contract", "Avg $"], ["built", "Built"], ["collected", "Collected"], ["open_value", "Open $"], ["owed_built", "Owed"], ["late", "Late"]].concat(owner ? [["commission", "Commission"]] : []);
  var money = ["sold_value", "avg_contract", "collected", "open_value", "owed_built", "commission"];
  return '<div class="panel" style="overflow:auto"><table class="tbl"><thead><tr>' + cols.map(function (c) { return '<th class="' + (c[2] === false ? "" : "n") + '" data-sort="' + c[0] + '" style="cursor:pointer">' + c[1] + (SORT === c[0] ? " ▾" : "") + "</th>"; }).join("") + "</tr></thead><tbody>" +
    reps.map(function (x) { return '<tr class="' + (x.rep === B.me.name ? "me" : "") + '">' + cols.map(function (c) { var v = x[c[0]]; var s = c[0] === "rep" ? esc(v) : c[0] === "close_rate" ? pct(v) : money.indexOf(c[0]) >= 0 ? (v == null ? "—" : esc(D.money(v))) : num(v); return '<td class="' + (c[2] === false ? "" : "n") + '">' + s + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
}
// Activity in Lynx: what each Lynx user logged on jobs in the window (B.activity, one row per person; a rep only gets their own row from the API)
var ACOLS = [["user", "Person", false], ["total", "Actions", "Everything they logged in Lynx in this window"], ["notes", "Notes", "Job messages (notes) added"], ["texts", "Texts", "Text messages sent from Lynx"], ["emails", "Emails", "Emails sent from Lynx"], ["appointments", "Appts", "Appointments set, moved or removed"], ["milestones", "Moves", "Milestone changes (Lead → Prospect → Approved …)"], ["files", "Files", "Files and photos uploaded"], ["money_entries", "Money", "Payments and payables entered"], ["jobs", "Jobs", "Different jobs they touched"], ["last7", "Last 7", "Actions in the last 7 days"], ["last_at", "Last seen", "Their latest entry in Lynx"]];
var AKPIS = [["notes", "notes"], ["texts", "texts"], ["emails", "emails"], ["appointments", "appts set"], ["milestones", "milestone moves"], ["files", "files"], ["money_entries", "money entries"], ["jobs", "jobs touched"], ["last7", "last 7 days"]];
function who(x) { return (x.role === "manager" ? "Sales manager" : x.role === "rep" ? "Sales rep" : x.role === "office" ? "Office" : x.role === "owner" ? "Owner" : x.on_team ? esc(x.role || "") : "Lynx user · not on the portal") + (x.active === false && x.on_team ? " · inactive" : ""); }
function actSort(rows) {
  return rows.slice().sort(function (a, b) {
    if (ASORT === "user") return String(a.user).localeCompare(String(b.user));
    if (ASORT === "last_at") return String(b.last_at || "").localeCompare(String(a.last_at || ""));
    return (+b[ASORT] || 0) - (+a[ASORT] || 0) || (+b.total || 0) - (+a.total || 0);
  });
}
function actTable(rows) {
  return '<div class="panel at" style="overflow:auto"><table class="tbl"><thead><tr>' + ACOLS.map(function (c) { return '<th class="' + (c[2] === false ? "" : "n") + '" data-asort="' + c[0] + '"' + (typeof c[2] === "string" ? ' title="' + esc(c[2]) + '"' : "") + ' style="cursor:pointer">' + c[1] + (ASORT === c[0] ? " ▾" : "") + "</th>"; }).join("") + "</tr></thead><tbody>" +
    rows.map(function (x) { return '<tr class="' + (x.user === B.me.name ? "me" : "") + '">' + ACOLS.map(function (c) { var v = x[c[0]]; var s = c[0] === "user" ? esc(v) + "<small>" + who(x) + "</small>" : c[0] === "last_at" ? esc(D.ago(v)) : num(v); return '<td class="' + (c[0] === "user" ? "p" : "n") + '">' + s + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
}
function actCard(x) {
  return '<div class="rep' + (x.user === B.me.name ? " me" : "") + '"><h3>' + esc(x.user) + "</h3>" +
    '<div class="role">' + who(x) + " · " + num(x.total) + " action" + (x.total === 1 ? "" : "s") + " · last seen " + esc(D.ago(x.last_at)) + "</div>" +
    '<div class="kpis">' + AKPIS.map(function (k) { return '<div class="kpi"><div class="v">' + num(x[k[0]]) + '</div><div class="l">' + k[1] + "</div></div>"; }).join("") + "</div></div>";
}
function actBlock(rows) { rows = actSort(rows); return (B.me.team ? actTable(rows) : "") + '<div class="cards">' + rows.map(actCard).join("") + "</div>"; }
function activity() {
  var all = B.activity || [], named = all.filter(function (x) { return x.user && x.user !== "Lynx user"; }), unnamed = all.filter(function (x) { return !x.user || x.user === "Lynx user"; });
  var h = '<div class="act' + (B.me.team ? " team" : "") + '"><div class="sech"><div><h3>' + (B.me.team ? "Activity in Lynx" : "My activity in Lynx") + ' <span class="n">last ' + B.days + ' days</span></h3><p class="hint">' + (B.me.team ? 'What every Lynx user logged on jobs in this window, busiest first. <span class="at">Tap a column to sort.</span>' : "What you logged on jobs in Lynx in this window.") + "</p></div></div>";
  if (B.activity_note) h += '<div class="warn">' + esc(B.activity_note) + "</div>";
  if (!all.length) { if (!B.activity_note) h += '<div class="empty">' + (B.me.team ? "No activity in Lynx in this window yet." : B.me.linked ? "Nothing logged in Lynx under your name in this window yet." : "Your login isn't linked to your Lynx user yet, so there is nothing to show. Ask the office to link it.") + "</div>"; }
  else {
    h += actBlock(named.length ? named : unnamed);
    if (named.length && unnamed.length && B.me.team) h += '<details class="grp"><summary><span>Activity with no named Lynx user · ' + unnamed.length + '<small>Entries the Lynx history credits to a user it can\'t name any more (removed logins, automations or the API).</small></span></summary><div>' + actBlock(unnamed) + "</div></details>";
  }
  return h + '<p class="note">Counted from each job\'s history in Lynx by the person who made the entry: notes = job messages, texts and emails sent from Lynx, appointments set or changed, milestone moves, files and photos uploaded, money entries = payments and payables. Jobs = different jobs they touched. No pay or bank figures here.</p></div>';
}
function paint() {
  var app = $("#app");
  if (!B) { app.innerHTML = D.errorBox(ERR); var rb = app.querySelector("[data-retry]"); if (rb) rb.onclick = load; return; }
  var y = window.scrollY, reps = (B.reps || []).slice(), C = B.company;
  reps.sort(function (a, b) { if (SORT === "rep") return String(a.rep).localeCompare(String(b.rep)); return (+b[SORT] || 0) - (+a[SORT] || 0); });
  var onTeam = reps.filter(function (x) { return x.on_team; }), others = reps.filter(function (x) { return !x.on_team; });
  var max = Math.max(1, Math.max.apply(null, reps.map(function (x) { return +x.sold_value || 0; })));
  var h = '<h2>' + (B.me.team ? "Team scorecard" : "My scorecard") + ' <span style="font:700 15px var(--body);color:var(--muted)">last ' + B.days + " days</span></h2>" +
    '<p class="sub">Read straight from Lynx: leads created, inspections on the calendar, jobs that reached Approved, roofs completed, money received. Close rate = leads created in this window that have since sold.' + (B.me.role === "owner" ? " Commission comes from the Master System and is shown to you only." : "") + "</p>" +
    (B.note ? '<div class="warn">' + esc(B.note) + "</div>" : "") +
    '<div class="toolbar"><div class="chips" style="margin:0">' + [30, 90, 365].map(function (d) { return '<button class="chip" data-days="' + d + '" aria-pressed="' + (DAYS === d) + '">' + (d === 365 ? "12 months" : d + " days") + "</button>"; }).join("") + "</div>" +
    (B.me.team ? '<div class="chips" style="margin:0"><button class="chip" data-view="cards" aria-pressed="' + (VIEW === "cards") + '">Cards</button><button class="chip" data-view="table" aria-pressed="' + (VIEW === "table") + '">Table</button></div>' : "") + "</div>";
  if (C && B.me.team) h += '<div class="stats"><div class="stat"><div class="v">' + esc(D.money(C.sold_value)) + '</div><div class="l">sold · ' + num(C.sold) + " jobs</div></div><div class=\"stat\"><div class=\"v\">" + num(C.leads) + '</div><div class="l">leads · ' + num(C.inspections) + " inspections</div></div><div class=\"stat\"><div class=\"v\">" + num(C.built) + '</div><div class="l">roofs built</div></div><div class="stat"><div class="v">' + esc(D.money(C.collected)) + '</div><div class="l">collected · ' + esc(D.money(C.owed_built)) + " owed on built</div></div></div>";
  if (!reps.length) h += '<div class="empty">No numbers yet.</div>';
  else if (VIEW === "table" && B.me.team) h += table(reps);
  else { h += '<div class="cards">' + onTeam.map(function (x, i) { return card(x, i, max); }).join("") + "</div>"; if (others.length && B.me.team) h += '<details class="grp" style="margin-top:14px;border:0"><summary>Other Lynx users with jobs · ' + others.length + '</summary><div class="cards" style="margin-top:8px">' + others.map(function (x, i) { return card(x, onTeam.length + i, max); }).join("") + "</div></details>"; }
  h += '<p class="note">Sold = the day the job reached Approved in Lynx. Collected = payments received on the rep\'s jobs in the window (job money, not pay). Late = jobs past the time their stage should take on the pipeline board. Refreshes every 5 minutes.</p>';
  h += activity();
  app.innerHTML = h;
  app.querySelectorAll("[data-days]").forEach(function (b) { b.onclick = function () { DAYS = +b.dataset.days; load(); }; });
  app.querySelectorAll("[data-view]").forEach(function (b) { b.onclick = function () { VIEW = b.dataset.view; paint(); }; });
  app.querySelectorAll("[data-sort]").forEach(function (t) { t.onclick = function () { SORT = t.dataset.sort; paint(); }; });
  app.querySelectorAll("[data-asort]").forEach(function (t) { t.onclick = function () { ASORT = t.dataset.asort; paint(); }; });
  app.querySelectorAll("[data-pipe]").forEach(function (b) { b.onclick = function () { if (window.parent !== window) window.parent.postMessage({ type: "dfw-open-pipeline", rep: b.dataset.pipe }, "*"); else location.href = "pipeline.html?rep=" + encodeURIComponent(b.dataset.pipe); }; });
  window.scrollTo(0, y);
}
D.poll(load);
})();
</script>
</body>
</html>
