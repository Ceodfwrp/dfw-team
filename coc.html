<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certificate of Completion</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

@media (prefers-color-scheme:dark){:root{--paper:#0F1419;--card:#1A222C;--ink:#EEF1F4;--muted:#9AA4B0;--line:#2C3744;--red-ink:#FF5A5A;--red-soft:#3A1416;--blue:#7FB0E8;--blue-soft:#18293C;--amber:#E8B04A;--amber-soft:#382B12;--green:#5CC28E;--green-soft:#12301F}}
*{box-sizing:border-box}

h2{font:800 30px/1.05 var(--display);margin:4px 0 2px}

.grid{display:grid;grid-template-columns:1fr;gap:8px 14px}

details.area>summary .c{margin-left:auto;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}

.item .amt b{display:block;color:var(--ink);font:700 15px var(--display)}
.item.x{opacity:.55}

.warn{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:10px 14px;margin:10px 0 0;font-size:14px}

.list .j{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.list .j:first-child{border-top:0}
.list .t{font-weight:700}.list .m{font-size:14px;color:var(--muted)}

.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.steps span{font:700 13px var(--body);padding:4px 10px;border-radius:999px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.steps span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.note{font-size:13px;color:var(--muted);margin:8px 2px 0}
.out a{word-break:break-all}
</style>
</head>

  need(110); y = Math.max(y + 24, 0);
  var sig = function (x, label, name) { doc.setDrawColor(17, 20, 24); doc.line(x, y, x + 228, y); doc.setFont("helvetica", "bold"); doc.setFontSize(8); mute(); doc.text(label, x, y + 12); if (name) { doc.setFont("helvetica", "normal"); doc.setFontSize(10); ink(); doc.text(doc.splitTextToSize(name, 228), x, y + 25); } };
  sig(M, "CONTRACTOR SIGNATURE", FIELDS.signer + ", " + CO.name); sig(W - M - 228, "HOMEOWNER SIGNATURE", FIELDS.homeowner); y += 60; sig(M, "DATE", ""); sig(W - M - 228, "DATE", "");
  footer(page);
  // photos
  var ok = PHOTOS.filter(function (p) { return p.up === "ok" && p.data; });
  if (ok.length) {
    var per = 6, cw = (W - 2 * M - 12) / 2, ch = 190;
    for (var k = 0; k < ok.length; k++) {
      if (k % per === 0) { doc.addPage(); page++; header(); doc.setFont("helvetica", "bold"); doc.setFontSize(13); ink(); doc.text("Completed work photos — " + FIELDS.address, M, 122); doc.setFont("helvetica", "normal"); doc.setFontSize(9); mute(); doc.text("Job #" + J.job.number + " · " + ok.length + " photo" + (ok.length === 1 ? "" : "s") + " · completed " + dShort(FIELDS.completed_on), M, 136); footer(page); }
      var col = k % 2, rowi = Math.floor((k % per) / 2), x = M + col * (cw + 12), yy = 150 + rowi * (ch + 14);
      try { doc.addImage(ok[k].data, "JPEG", x, yy, cw, ch - 16, undefined, "FAST"); } catch (e) { /* skip a bad image */ }
      doc.setFontSize(8); mute(); doc.text(String(k + 1) + ". " + ok[k].name.slice(0, 48), x, yy + ch - 4);
    }
  }
  return doc;
}

/* ---------- actions ---------- */
async function loadQueue() { try { Q = await api("queue"); } catch (e) { ERR = e.message === "http_404" ? "The COC queue isn’t answering right now. Reload the page in a minute." : e.message; } paint(); }
async function openJob(j) {
  if (!j) return; BUSY = true; ERR = ""; RESULT = null; PREVIEW = false; paint();
  try {
    J = await api("job", { job: String(j).trim() }); DONE = {}; PHOTOS = []; EXTRA = "";
    items().forEach(function (i) { DONE[i.n] = !i.excluded; });
    var H = J.homeowner || {}, A = J.job.address || {}, I = J.insurance || {}, C = J.completion || {};
    FIELDS = { homeowner: H.display || "", address: [A.street, [A.city, A.state].filter(Boolean).join(", ") + (A.zip ? " " + A.zip : "")].filter(Boolean).join(", "),
      carrier: I.carrier || "", claim: I.claim_number || "", policy: I.policy_number || "", dol: I.date_of_loss || "", completed_on: C.build_date || "", signer: CO.signer };
  } catch (e) { ERR = e.message === "job_not_found" ? "No Lynx job #" + j + " in the synced data." : e.message; J = null; }
  BUSY = false; paint();
}
async function uploadEstimate(file) {
  BUSY = true; ERR = ""; paint();
  try {
    var b64 = await new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(",")[1]); }; r.onerror = function () { rej(new Error("Couldn't read the file")); }; r.readAsDataURL(file); });
    var r = await api("scope_upload", { job_id: J.job.id, filename: file.name, data: b64 });
    J.amounts = r.amounts;
    if (r.unmatched_scope > 0) ERR = "Estimate read: " + r.lines + " priced lines, " + r.matched + " matched to the approved scope. " + r.unmatched_scope + " scope line" + (r.unmatched_scope === 1 ? "" : "s") + " had no match — those show without a depreciation figure.";
  } catch (e) { ERR = "Estimate upload: " + e.message; }
  BUSY = false; paint();
}
async function fileIt() {
  var T = tally(); if (T.release == null || !T.done.length) return;
  BUSY = true; ERR = ""; paint();
  try {
    var pdf = buildPdf(); var b64 = pdf.output("datauristring").split(",")[1];
    var itemsOut = activeItems().map(function (i) { var a = amountFor(i); return { n: i.n, area: i.area, description: i.description, qty: i.qty, unit: i.unit, done: !!DONE[i.n], deprec: a ? a.deprec : null, non_recoverable: a ? a.non_recoverable : null }; });
    RESULT = await api("file", { job_id: J.job.id, op_id: opId(), pdf: b64, fields: Object.assign({}, FIELDS, { mode: T.mode, basis: T.why }), items: itemsOut, work_text: EXTRA, release: T.release, photos: PHOTOS.filter(function (p) { return p.path; }).map(function (p) { return p.path; }) });
    RESULT.blob = pdf.output("blob");
  } catch (e) { ERR = "Couldn't file the COC: " + e.message; }
  BUSY = false; paint();
}

/* ---------- paint ---------- */
function paint() {
  var app = $("#app"), h = "";
  if (ERR === "signin") { app.innerHTML = '<div class="err">Your sign-in has expired. Sign out of the team app and back in, then open COC again.</div>'; return; }
  if (ERR === "forbidden") { app.innerHTML = '<div class="err">The COC creator is for the office and managers. Ask Blake if you need it.</div>'; return; }
  h += '<h2>Certificate of Completion</h2><p class="sub">Type the Lynx job number, tick what was completed, add the finished photos, and the COC is written, saved and filed to the job in Lynx.</p>';
  h += '<div class="panel"><div class="row"><input class="jobin" id="jobNum" type="search" inputmode="numeric" placeholder="Job #" value="' + esc(J ? J.job.number : paramJob()) + '"><button class="btn" id="goJob" type="button">Open</button>' + (J ? '<a class="btn ghost" href="' + esc(J.job.lynx) + '" target="_blank" rel="noopener">Open in Lynx</a>' : "") + "</div>";
  if (!J && Q && Q.jobs) {
    var list = Q.jobs.filter(function (x) { return !QSEARCH || (x.job_number + " " + (x.homeowner || "") + " " + (x.address || "")).toLowerCase().indexOf(QSEARCH.toLowerCase()) >= 0; });
    h += '<p class="fresh" style="margin-top:12px">Built jobs that still need a COC · ' + list.length + "</p>" + '<div class="list">' + (list.map(function (x) {
      var tag = x.status === "needs_updated" ? '<span class="tag a">Needs updated COC</span>' : x.status === "made" ? '<span class="tag g">COC made ' + esc(stamp(x.coc_made_at)) + "</span>" : x.status === "sent" ? '<span class="tag g">COC sent</span>' : '<span class="tag r">Needed</span>';
      return '<div class="j" data-open="' + esc(x.job_number) + '"><div><div class="t">#' + esc(x.job_number) + " " + esc(x.homeowner || "") + '</div><div class="m">' + esc(x.address || "") + " · built " + esc(dShort(x.build_date)) + " · " + esc(x.days_since_build) + " days ago</div></div><div>" + tag + "</div></div>";
    }).join("") || '<div class="m">Nothing is waiting for a COC.</div>') + "</div>";
  }
  h += "</div>";
  if (ERR && ERR !== "signin") h += '<div class="err" style="margin:0 0 14px">' + esc(ERR) + "</div>";
  if (BUSY && !J) h += '<div class="panel">Working…</div>';
  if (J) {
    var T = tally(), C = J.completion || {}, M = J.money || {}, A = J.amounts;
    h += '<div class="steps"><span class="on">1 Facts</span><span class="on">2 What was completed</span><span class="on">3 Photos</span><span class="' + (T.release != null ? "on" : "") + '">4 Create &amp; file</span></div>';
    // facts
    h += '<div class="panel"><h3>' + esc(J.job.name || ("#" + J.job.number)) + '</h3><p class="fresh">' + esc(J.job.milestone) + " in Lynx · facts checked " + esc(stamp(J.homeowner && J.homeowner.facts_at)) + " · worksheet synced " + esc(stamp(M.worksheet_as_of)) + "</p>";
    h += '<div class="chk">' + checks().map(function (c) { return '<div class="r ' + c.s + '"><div><b>' + esc(c.b) + "</b><small>" + esc(c.m) + "</small></div></div>"; }).join("") + "</div>";
    var f = function (k, l, t, src) { return '<div class="f"><label for="f_' + k + '">' + l + '</label><input id="f_' + k + '" data-f="' + k + '" type="' + (t || "text") + '" value="' + esc(FIELDS[k] || "") + '">' + (src ? '<div class="src">' + esc(src) + "</div>" : "") + "</div>"; };
    h += '<div class="grid" style="margin-top:12px">' + f("homeowner", "Homeowner", "text", "Lynx contact" + (J.homeowner && J.homeowner.lynx_contact_name && J.homeowner.lynx_contact_name !== FIELDS.homeowner ? " (cleaned from: " + J.homeowner.lynx_contact_name + ")" : "")) + f("address", "Property address", "text", "Lynx job address") +
      f("carrier", "Insurance carrier", "text", "Lynx insurance tab") + f("claim", "Claim number", "text", "Lynx insurance tab") + f("policy", "Policy number", "text", J.insurance && J.insurance.policy_number ? "Lynx custom field" : "Not in Lynx — optional") + f("dol", "Date of loss", "date", J.insurance && J.insurance.date_of_loss ? "Lynx insurance tab" : "Not in Lynx — optional") +
      f("completed_on", "Date work completed", "date", C.build_date ? "BUILD on the Lynx calendar" : "No BUILD on the calendar") + f("signer", "Signed for DFW Roofing Pro by", "text", "") + "</div></div>";
    // scope
    var g = {}; items().forEach(function (i) { (g[i.area || "Other"] = g[i.area || "Other"] || []).push(i); });
    h += '<div class="panel"><h3>What was completed</h3><p class="fresh">Approved scope: ' + esc(J.scope && J.scope.file || "no scope document on file") + (J.scope && J.scope.received_at ? " · received " + esc(stamp(J.scope.received_at)) : "") + " · " + T.act.length + " items" + (items().length - T.act.length ? " (" + (items().length - T.act.length) + " excluded by the carrier)" : "") + '</p><div class="row" style="margin:0 0 8px"><button class="btn ghost" type="button" id="allOn">All completed</button><button class="btn ghost" type="button" id="allOff">None</button><span class="tag ' + (T.all ? "g" : "a") + '">' + T.done.length + " of " + T.act.length + " completed</span></div>";
    h += Object.keys(g).map(function (ar) {
      var L = g[ar], n = L.filter(function (i) { return !i.excluded && DONE[i.n]; }).length, tot = L.filter(function (i) { return !i.excluded; }).length;
      return '<details class="area" open><summary><input type="checkbox" data-area="' + esc(ar) + '" ' + (n === tot && tot > 0 ? "checked" : "") + ' aria-label="Whole area"> ' + esc(ar) + '<span class="c">' + n + "/" + tot + "</span></summary>" + L.map(function (i) {
        var a = amountFor(i);
        return '<label class="item' + (i.excluded ? " x" : "") + '"><input type="checkbox" data-n="' + i.n + '" ' + (DONE[i.n] ? "checked" : "") + (i.excluded ? " disabled" : "") + '><div><div class="d">' + esc(i.description) + '</div><div class="q">' + esc(qty(i.qty)) + " " + esc(i.unit) + (i.excluded ? " · excluded from the award" : "") + '</div></div><div class="amt">' + (a ? (a.non_recoverable ? "non-recoverable" : "depreciation") + "<b>" + esc(money(a.deprec)) + "</b>" : (A && A.lines ? '<span class="tag a">no line match</span>' : "")) + "</div></label>";
      }).join("") + "</details>";
    }).join("");
    h += '<div class="f" style="margin-top:12px"><label for="extra">Anything else the crew did (optional)</label><textarea id="extra" placeholder="Example: replaced 4 sheets of decking found rotten under the old shingles.">' + esc(EXTRA) + "</textarea></div></div>";
    // money
    h += '<div class="panel"><h3>Recoverable depreciation to release</h3>';
    if (T.release != null) h += '<div class="moneybox"><div><div class="money">' + esc(money(T.release)) + '</div><div class="l">' + esc(T.why) + "</div></div></div>";
    else h += '<div class="err" style="margin:0">' + esc(T.blocked) + "</div>";
    h += '<div class="note">Lynx worksheet: ' + ((M.depreciation_lines || []).map(function (l) { return esc(l.name) + " " + esc(money(l.amount)); }).join(", ") || "no DEPRECIATION line") + (M.depreciation_received > 0 ? " · received so far " + esc(money(M.depreciation_received)) : "") + (A && A.lines ? " · estimate on file: " + esc(A.file) + " (" + A.matched + " of " + A.n + " lines matched, recoverable " + esc(money(A.deprec_total)) + (A.nonrec_total > 0 ? ", non-recoverable " + esc(money(A.nonrec_total)) : "") + ")" : " · no itemized estimate uploaded yet") + "</div>";
    h += '<div class="row" style="margin-top:10px"><label class="btn ghost">' + (A && A.lines ? "Replace the itemized estimate (PDF)" : "Upload the carrier’s itemized estimate (PDF)") + '<input type="file" id="estFile" accept="application/pdf" hidden></label><span class="note" style="margin:0">Needed only when part of the scope was completed, or when the worksheet has no DEPRECIATION line. The RCV never appears on the COC.</span></div></div>';
    // photos
    h += '<div class="panel"><h3>Completed work photos</h3><p class="fresh">Roof, accessories, cleanup. They go on the last pages of the COC. ' + PHOTOS.filter(function (p) { return p.up === "ok"; }).length + " ready.</p>" +
      '<div class="row"><label class="btn ghost">Add photos<input type="file" id="photoFiles" accept="image/*" multiple hidden></label><label class="btn ghost">Take a photo<input type="file" id="photoCam" accept="image/*" capture="environment" hidden></label></div>' +
      (PHOTOS.length ? '<div class="thumbs">' + PHOTOS.map(function (p, k) { return "<div>" + (p.data ? '<img src="' + p.data + '" alt="">' : '<div style="aspect-ratio:1;background:var(--paper);border-radius:8px"></div>') + '<button type="button" data-rm="' + k + '" aria-label="Remove">×</button><span class="up">' + esc(p.up === "ok" ? "saved" : p.up) + "</span></div>"; }).join("") + "</div>" : "") + "</div>";
    // file
    h += '<div class="panel">';
    if (RESULT) {
      var up = RESULT.lynx && (RESULT.lynx.status === 200 || RESULT.lynx.status === 201 || RESULT.lynx.status === 202);
      h += '<div class="okbox"><b>COC created' + (up ? " and filed to the job’s COC folder in Lynx" : "") + ".</b>" + (RESULT.lynx && !up ? " Lynx did not accept the upload (http " + esc(RESULT.lynx.status) + "); the PDF is saved here, so download it and add it to the job by hand." : "") + (RESULT.note_status === 201 || RESULT.note_status === 200 ? " A note was posted on the job." : "") + "</div>" +
        '<div class="row out" style="margin-top:10px">' + (RESULT.pdf_url ? '<a class="btn" href="' + esc(RESULT.pdf_url) + '" target="_blank" rel="noopener">Open the COC PDF</a>' : "") + '<button class="btn ghost" type="button" id="dl">Download PDF</button><a class="btn ghost" href="' + esc(J.job.lynx) + '" target="_blank" rel="noopener">Open the job in Lynx</a></div>' +
        '<p class="note">Next: get the homeowner’s signature, then send the signed COC to ' + esc(FIELDS.carrier || "the carrier") + (FIELDS.claim ? " with claim " + esc(FIELDS.claim) : "") + ' to release ' + esc(money(RESULT.depreciation_release != null ? RESULT.depreciation_release : T.release)) + ". When it’s sent, add “COC SENT m/d” to the job name in Lynx.</p>";
    } else {
      h += '<button class="btn big" id="fileIt" type="button" ' + (T.release == null || !T.done.length || BUSY || PHOTOS.some(function (p) { return p.up === "resizing" || p.up === "uploading"; }) ? "disabled" : "") + ">" + (BUSY ? "Working…" : "Create COC PDF and file it in Lynx") + "</button>" +
        '<p class="note">One tap writes the certificate (no RCV figure, only the depreciation above), adds the photo pages, saves it here, uploads it to the job’s COC folder in Lynx and posts a note on the job. Nothing is emailed to the carrier or homeowner.</p>' +
        '<div class="row" style="margin-top:8px"><button class="btn ghost" type="button" id="preview" ' + (T.release == null || !T.done.length ? "disabled" : "") + ">Preview the PDF first</button></div>";
    }
    h += "</div>";
  }
  app.innerHTML = h;
  // wiring
  var go = $("#goJob"), jn = $("#jobNum"); if (go) go.onclick = function () { openJob(jn.value.replace(/^#/, "")); };
  if (jn) jn.onkeydown = function (e) { if (e.key === "Enter") openJob(jn.value.replace(/^#/, "")); };
  if (jn && !J) jn.oninput = function () { QSEARCH = jn.value; var l = app.querySelector(".list"); if (l) { /* light filter without full repaint */ } paint(); jn.focus(); var v = jn.value; jn.setSelectionRange(v.length, v.length); };
  app.querySelectorAll("[data-open]").forEach(function (el) { el.onclick = function () { openJob(el.dataset.open); }; });
  if (!J) return;
  app.querySelectorAll("[data-f]").forEach(function (el) { el.oninput = function () { FIELDS[el.dataset.f] = el.value; }; el.onchange = function () { FIELDS[el.dataset.f] = el.value; if (el.dataset.f === "completed_on") paint(); }; });
  app.querySelectorAll("input[data-n]").forEach(function (el) { el.onchange = function () { DONE[+el.dataset.n] = el.checked; paint(); }; });
  app.querySelectorAll("input[data-area]").forEach(function (el) { el.onclick = function (e) { e.stopPropagation(); }; el.onchange = function () { items().forEach(function (i) { if ((i.area || "Other") === el.dataset.area && !i.excluded) DONE[i.n] = el.checked; }); paint(); }; });
  var on = $("#allOn"), off = $("#allOff"); if (on) on.onclick = function () { activeItems().forEach(function (i) { DONE[i.n] = true; }); paint(); }; if (off) off.onclick = function () { activeItems().forEach(function (i) { DONE[i.n] = false; }); paint(); };
  var ex = $("#extra"); if (ex) ex.oninput = function () { EXTRA = ex.value; };
  var ef = $("#estFile"); if (ef) ef.onchange = function () { if (ef.files[0]) uploadEstimate(ef.files[0]); };

  var pc = $("#photoCam"); if (pc) pc.onchange = function () { addPhotos(Array.from(pc.files)); };
  app.querySelectorAll("[data-rm]").forEach(function (b) { b.onclick = function () { PHOTOS.splice(+b.dataset.rm, 1); paint(); }; });
  var fi = $("#fileIt"); if (fi) fi.onclick = fileIt;
  var pv = $("#preview"); if (pv) pv.onclick = function () { try { var d = buildPdf(); var url = URL.createObjectURL(d.output("blob")); window.open(url, "_blank"); } catch (e) { ERR = "Preview failed: " + e.message; paint(); } };
  var dl = $("#dl"); if (dl) dl.onclick = function () { if (!RESULT || !RESULT.blob) return; var a = document.createElement("a"); a.href = URL.createObjectURL(RESULT.blob); a.download = "COC-" + J.job.number + ".pdf"; document.body.appendChild(a); a.click(); a.remove(); };
}

loadQueue();
var pj = paramJob(); if (pj) openJob(pj);
})();
