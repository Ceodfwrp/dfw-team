name: lynx-order-robot
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests playwright && python -m playwright install --with-deps chromium
      - run: python scripts/lynx_robot.py
        env:
          LYNX_ROBOT_TOKEN: ${{ secrets.LYNX_ROBOT_TOKEN }}
