name: lynx-notes-robot
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}
concurrency: { group: lynx-notes, cancel-in-progress: false }
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests playwright && python -m playwright install --with-deps chromium
      - run: python scripts/lynx_robot.py notes
        env:
          LYNX_ROBOT_TOKEN: ${{ secrets.LYNX_ROBOT_TOKEN }}
          NOTES_BUDGET_MIN: "45"
          NOTES_MAX_JOBS: "120"
